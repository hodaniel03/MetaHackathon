<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>CaseFolder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF9F6; --surface: #FFFFFF; --line: #E5E1D8; --ink: #162232; --muted: #4A5668;
  --primary: #1E3A5F; --ok: #14714A; --ok-bg: #E8F3EE;
  --warn: #9A6B00; --warn-ink: #7A5500; --warn-bg: #FFF4D6;
  --bad: #B42318; --bad-bg: #FCECEA; --mark: #FFF1A8; --quote-bg: #F3F2EE; --ctl: #6B7686; --neutral-bg: #EEECE6;
  --r: 12px;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 "Public Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; margin: 0; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.375rem; }
h3 { font-size: 1.125rem; }
h4 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--primary); }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--primary); color: #fff; padding: 12px 16px; border-radius: 8px; z-index: 20; }
.skip:focus { left: 8px; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: 6px; }
.meta { font-size: .875rem; color: var(--muted); }
.lead { font-size: 1.125rem; color: var(--ink); max-width: 62ch; }
.eyebrow { font-size: .875rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.stack > * + * { margin-top: 24px; }
.stack-s > * + * { margin-top: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.ic { flex: none; vertical-align: middle; }

/* Top */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; min-height: 72px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1.125rem; color: var(--primary); text-decoration: none; min-height: 44px; }
.casename { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 16px; border-left: 1px solid var(--line); }
.top-actions { display: flex; gap: 16px; align-items: center; margin-left: auto; flex-wrap: wrap; }
@media (max-width: 640px) {
  .top-in { display: grid; grid-template-columns: 1fr auto auto; grid-template-areas: "brand lang share" "name name switch"; gap: 4px 12px; min-height: 0; padding-top: 8px; padding-bottom: 8px; }
  .top-actions { display: contents; }
  .brand { grid-area: brand; }
  .casename { grid-area: name; border-left: 0; padding-left: 0; }
  .switch { grid-area: switch; }
  .langbtn { grid-area: lang; }
  .top-actions .share { grid-area: share; justify-self: end; }
}
.switch { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; border: 0; background: none; font: inherit; color: var(--ink); cursor: pointer; padding: 0; }
.switch .track { width: 44px; height: 26px; border-radius: 999px; background: var(--ctl); position: relative; transition: background .15s; flex: none; }
.switch .thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] .track { background: var(--primary); }
.switch[aria-checked="true"] .thumb { transform: translateX(18px); }
@media (prefers-reduced-motion: reduce) { .switch .track, .switch .thumb { transition: none; } }

.tabs { background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs ul { display: flex; gap: 4px; list-style: none; margin: 0 auto; padding: 0 20px; max-width: 880px; }
.tabs a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 14px; color: var(--ink); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { background: var(--quote-bg); }
.tabs a[aria-current="page"] { border-bottom-color: var(--primary); font-weight: 600; color: var(--primary); }
.tabs a:focus-visible { outline-offset: -3px; }

main { padding-top: 32px; padding-bottom: 48px; }
main:focus { outline: none; }
footer.foot { padding-top: 0; padding-bottom: 48px; }

/* Buttons and forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 20px; border-radius: 10px; border: 1.5px solid var(--primary); background: var(--surface); color: var(--primary); font-family: inherit; font-weight: 600; font-size: 1rem; line-height: 1.2; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--quote-bg); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { background: #17304F; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; font-family: inherit; font-weight: 600; font-size: 1rem; line-height: 1.3; color: var(--primary); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
label { display: block; font-size: .9375rem; font-weight: 600; margin: 16px 0 6px; }
input, select, textarea { width: 100%; min-height: 48px; padding: 10px 14px; border: 1.5px solid var(--ctl); border-radius: 10px; background: #fff; color: var(--ink); font: inherit; }
textarea { min-height: 120px; resize: vertical; }
textarea.big { min-height: 280px; }
.copyrow { display: flex; gap: 12px; flex-wrap: wrap; }
.copyrow input { flex: 1; min-width: 220px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); border: 1px solid #E8D49A; }
.notice.bad { background: var(--bad-bg); color: var(--bad); border-color: #E7B8B2; }
.notice > div { color: var(--ink); }
.notice .ic { margin-top: 3px; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: .875rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; line-height: 1.4; }
.badge.ok { color: var(--ok); background: var(--ok-bg); }
.badge.warn { color: var(--warn-ink); background: var(--warn-bg); }
.badge.bad { color: var(--bad); background: var(--bad-bg); }
.badge.neutral { color: var(--ink); background: var(--neutral-bg); }

/* The verified claim */
.claim { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: var(--r); padding: 20px 24px; }
.claim.is-bad { border: 1.5px solid var(--bad); border-left-width: 4px; }
.claim-text { font-size: 1.125rem; font-weight: 600; margin: 12px 0 4px; line-height: 1.35; }
.claim-detail { color: var(--ink); margin-top: 4px; }
.quote { margin: 12px 0 0; padding: 12px 16px; background: var(--quote-bg); border-radius: 8px; font: italic 400 1.0625rem/1.6 "Source Serif 4", Georgia, serif; }
.src { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-top: 12px; font-size: .875rem; color: var(--muted); }
.evidence { margin-top: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.evidence h4 { margin-bottom: 8px; }
.excerpt { white-space: pre-wrap; background: var(--surface); }
mark { background: var(--mark); color: var(--ink); padding: 1px 2px; border-radius: 3px; }
.evidence figure { margin: 16px 0 0; }
.evidence img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
.evidence figcaption { margin-top: 6px; }
.claim-toggle { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.claim-toggle .when { font-size: .875rem; color: var(--muted); min-width: 64px; flex: none; }
.claim-toggle .ttl { flex: 1; font-weight: 600; font-size: 1.0625rem; line-height: 1.35; }
.claim-toggle .chev { transition: transform .15s; flex: none; }
.claim-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.claim-body { margin-top: 12px; }

/* Overview */
.att-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .att-grid { grid-template-columns: repeat(3, 1fr); } }
.att { display: flex; flex-direction: column; gap: 12px; }
.att .grow { flex: 1; }
.bigdate, .bignum { font-size: 2rem; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
.progress { height: 10px; border-radius: 999px; background: var(--neutral-bg); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.plain-list { margin: 0; padding-left: 20px; }
.plain-list li { margin: 4px 0; }
.trust { display: flex; gap: 16px; align-items: flex-start; }
.trust .ic { margin-top: 4px; color: var(--ok); }
.trust.some-bad .ic { color: var(--bad); }
.skeleton { color: var(--muted); }

/* Timeline */
.timeline { list-style: none; margin: 0 0 0 8px; padding: 0 0 0 28px; border-left: 2px solid var(--line); }
.timeline > li { position: relative; padding-bottom: 20px; }
.timeline > li:last-child { padding-bottom: 0; }
.timeline > li::before { content: ""; position: absolute; left: -37px; top: 22px; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); border: 3px solid var(--bg); }

/* Documents */
.drop { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 32px 24px; border: 2px dashed var(--ctl); border-radius: var(--r); background: var(--surface); cursor: pointer; width: 100%; font: inherit; color: var(--ink); }
.drop:hover, .drop.over { background: var(--quote-bg); border-color: var(--primary); }
.drop strong { font-size: 1.125rem; }
.drop .ic { color: var(--primary); }
.docrow { display: flex; gap: 16px; align-items: center; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-align: left; width: 100%; font: inherit; color: var(--ink); cursor: pointer; min-height: 88px; }
.docrow:hover { background: var(--quote-bg); }
.docrow .grow { flex: 1; min-width: 0; }
.docrow strong { display: block; line-height: 1.3; }
.thumb { width: 56px; height: 72px; border-radius: 6px; border: 1px solid var(--line); background: var(--quote-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }

/* Deadlines */
.calc { display: flex; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; margin: 12px 0 4px; padding: 16px; background: var(--quote-bg); border-radius: 10px; }
.calc dt { font-size: .875rem; color: var(--muted); }
.calc dd { margin: 0; font-weight: 600; font-size: 1.125rem; }
.calc .res dd { font-size: 1.375rem; }
.calc .op { font-size: 1.375rem; color: var(--muted); padding-bottom: 2px; }

/* Missing */
.check { display: flex; gap: 16px; align-items: flex-start; padding: 20px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check input[type="checkbox"] { width: 24px; height: 24px; min-height: 24px; margin: 8px 0 0; padding: 0; accent-color: var(--primary); flex: none; cursor: pointer; }
.check .ck-title { display: block; margin: 0; padding: 6px 0; font-size: 1.0625rem; font-weight: 600; cursor: pointer; min-height: 44px; }
.check.done .ck-title { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--muted); }
.check .grow { flex: 1; min-width: 0; }

/* Simple view */
body.simple main { font-size: 1.25rem; line-height: 1.75; color: #0B1620; }
body.simple h1 { font-size: 2.25rem; }
body.simple h2 { font-size: 1.625rem; margin: 48px 0 12px; }
body.simple .simple-list { padding-left: 28px; }
body.simple .simple-list li { margin: 16px 0; padding-left: 4px; }
body.simple .btn { font-size: 1.125rem; min-height: 52px; }
body.simple .meta { font-size: 1rem; }

/* Dialogs */
dialog { max-width: 960px; width: calc(100% - 24px); max-height: calc(100vh - 24px); overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); padding: 24px; }
dialog::backdrop { background: rgba(22, 34, 50, .55); }
.intake { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 16px; }
.intake > div:first-child { position: sticky; top: 0; align-self: start; }
@media (max-width: 820px) { .intake { grid-template-columns: 1fr; } .intake > div:first-child { position: static; } }
.pages { max-height: 70vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--quote-bg); }
.pages img, details.orig img { width: 100%; display: block; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; background: #fff; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chips button { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E8D49A; background: var(--warn-bg); color: var(--warn-ink); font-family: inherit; font-weight: 600; font-size: .9375rem; line-height: 1; cursor: pointer; }
pre.text { white-space: pre-wrap; font: inherit; margin: 12px 0 0; max-height: 50vh; overflow: auto; background: var(--quote-bg); padding: 16px; border-radius: 10px; }
details.orig { margin-top: 12px; }
details.orig summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--primary); }
.out { white-space: pre-wrap; background: var(--quote-bg); border-radius: 10px; padding: 20px; margin-top: 16px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; z-index: 30; }
#toast.on { opacity: 1; }

/* PDF, trust hero, voice note, handover options */
.pdfbox { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 32px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--quote-bg); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 12px; }
@media (max-width: 640px) { .stats { grid-template-columns: 1fr; } }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .numrow { display: flex; align-items: center; gap: 8px; }
.stat .num { font-size: 2.5rem; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
.stat .lbl { color: var(--ink); }
.stat.okc { color: var(--ok); }
.stat.badc { color: var(--bad); }
.rec-live { display: flex; align-items: center; gap: 8px; font-size: 1.125rem; }
.rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }
.check-row { display: flex; gap: 16px; align-items: flex-start; cursor: pointer; margin: 0; font-weight: 400; font-size: 1rem; }
.check-row input { width: 24px; height: 24px; min-height: 24px; margin-top: 4px; padding: 0; accent-color: var(--primary); flex: none; }

/* Handover and print */
.handover section { margin-top: 32px; }
.handover .claim { break-inside: avoid; }
@media print {
  body { background: #fff; font-size: 12pt; }
  .top, .tabs, .noprint, .skip, #toast, footer.foot { display: none !important; }
  main { padding: 0; }
  .wrap { max-width: none; padding: 0; }
  .claim, .card { break-inside: avoid; box-shadow: none; }
  a { color: inherit; text-decoration: none; }
}
</style>
</head>
<body>

<nav class="tabs" id="tabs" hidden></nav>

<footer class="wrap foot meta" id="foot"></footer>
<dialog id="viewer"></dialog>
<dialog id="intake"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: 'Unexpected response from the server.' }));
  if (!r.ok || j.error) throw new Error(j.error || 'Something went wrong.');
  return j;
}

/* ---------- The verified claim ---------- */
function locate(text, quote) {
  if (!quote) return null;
  const tokens = quote.trim().split(/\s+/).map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  try {
    const m = new RegExp(tokens.join('[\\s\\f]+'), 'i').exec(text);
    return m ? { i: m.index, len: m[0].length } : null;
  } catch { return null; }
}

function pageOf(d, quote) {
  if (!d || (!d.text.includes('\f') && (d.files?.length || 0) <= 1)) return null;
  const l = locate(d.text, quote);
  return l ? d.text.slice(0, l.i).split('\f').length : null;
}

function evidenceHtml(d, quote) {
  const l = locate(d.text, quote), pg = pageOf(d, quote);
  let body;
  if (l) {
    const a = Math.max(0, l.i - 260), b = Math.min(d.text.length, l.i + l.len + 260), clean = (s) => esc(s.replace(/\f/g, ''));
    body = `<p class="excerpt">${a > 0 ? '… ' : ''}${clean(d.text.slice(a, l.i))}<mark>${clean(d.text.slice(l.i, l.i + l.len))}</mark>${clean(d.text.slice(l.i + l.len, b))}${b < d.text.length ? ' …' : ''}</p>`;
  } else body = `<p>${esc(t('quoteNotFound'))}</p>`;
  const img = d.files?.length
    ? `<figure><img loading="lazy" src="/api/cases/${st.token}/files/${esc(d.files[Math.min((pg || 1) - 1, d.files.length - 1)])}" alt="${esc(t('originalAlt', d.title, pg))}"><figcaption class="meta">${esc(t('origCaption', pg))}</figcaption></figure>` : '';
  const pdfLink = d.pdf ? `<p style="margin-top:8px"><a class="btn-link" href="/api/cases/${st.token}/files/${esc(d.pdf)}${pg ? `#page=${pg}` : ''}" target="_blank" rel="noopener">${esc(pg ? t('openPdfPage', pg) : t('openPdf'))}</a></p>` : '';
  return `<div class="evidence"><h4>${esc(t('howItReads'))}</h4>${body}${img}${pdfLink}<p style="margin-top:8px"><button class="btn-link" data-act="open-doc" data-id="${esc(d.id)}" data-quote="${esc(quote || '')}">${esc(t('openFullDoc'))}</button></p></div>`;
}

// id: unique key for view state. collapsed: timeline style, opened by the claim as a button.
// rd: text filter (used to hide ID numbers). plain: no evidence button (used on the printable handover).
function claimCard({ id, claim = '', detail = '', quote = '', dok, verified, collapsed = false, date = '', top = '', after = '', rd = (x) => x, plain = false }) {
  const d = docById(dok), open = st.open.has(id), showEv = st.ev.has(id) && !plain, voice = d?.source === 'tale';
  const vb = verified ? badge('ok', 'check', t(voice ? 'vCheckedVoice' : 'vChecked')) : badge('bad', 'alert', t('vUnchecked'));
  const pg = d && quote ? pageOf(d, quote) : null;
  const src = d ? `${esc(d.title)} · ${esc(fmtShort(d.date))}${pg ? ` · ${esc(t('pageN', pg))}` : ''}` : esc(t('unknownDoc'));
  const inner = `
    ${top}${detail ? `<p class="claim-detail">${esc(rd(detail))}</p>` : ''}
    ${quote ? `<blockquote class="quote">«${esc(rd(quote))}»</blockquote>` : ''}
    ${voice && quote ? `<p class="meta" style="margin-top:6px">${esc(t('voiceCaveat'))}</p>` : ''}
    ${d ? `<div class="src"><span>${src}</span>${plain ? '' : `<button class="btn-link" data-act="evidence" data-id="${esc(id)}" aria-expanded="${showEv}">${esc(showEv ? t('hide') : t('viewInDoc'))} ${icon(showEv ? 'x' : 'arrow', 16)}</button>`}</div>` : ''}
    ${showEv && d ? evidenceHtml(d, quote) : ''}${after}`;
  if (collapsed) {
    return `<article class="claim ${verified ? '' : 'is-bad'}">
      <button class="claim-toggle" data-act="toggle-claim" data-id="${esc(id)}" aria-expanded="${open}" aria-controls="cb-${esc(id)}">
        <span class="when">${esc(fmtShort(date))}</span><span class="ttl">${capEsc(rd(claim))}</span>${icon('chevron', 20).replace('class="ic"', 'class="ic chev"')}
      </button>
      <div class="claim-body" id="cb-${esc(id)}" ${open ? '' : 'hidden'}>${vb}${inner}</div></article>`;
  }
  return `<article class="claim ${verified ? '' : 'is-bad'}">${vb}${claim ? `<h3 class="claim-text">${capEsc(rd(claim))}</h3>` : ''}${inner}</article>`;
}

  if (n <= 14) return badge('warn', 'clock', t('inDays', n));
  return badge('neutral', 'clock', t('inDays', n));
};

async function openCase(token, page = 'oversikt') {
  st = { token, page, hideIds: true, c: null, docs: [], analysis: null, aState: 'none', checks: {}, pending: [], open: new Set(), ev: new Set(), answer: null, draft: null, busy: '', err: '' };
  renderCase();
  try {
    const v = await api('GET', `/api/cases/${token}`);
    if (st?.token !== token) return;
    remember(token, v.case.name);
    applyView(v);
    focusMain();
  } catch (e) {
    if (st?.token !== token) return;
    $('#app').innerHTML = `<div class="stack"><h1>${esc(t('notFoundTitle'))}</h1><div class="notice bad" role="alert">${icon('alert')}<div>${esc(e.message)}</div></div><p><a class="btn" href="#/">${esc(t('backToCases'))}</a></p></div>`;
  }
}

  st.c = v.case; st.docs = v.documents; st.analysis = v.analysis; st.aState = v.analysisState; st.checks = v.checks || {};

async function guarded(label, fn) {
  st.busy = label; st.err = ''; renderPage();
  try { await fn(); } catch (e) { st.err = e.message; }

async function analyze() {
  if (!st.docs.length || st.pending.length) return;
  const token = st.token;
  st.err = ''; st.analysis = {}; st.pending = ['a', 'b', 'c']; renderPage();
  let ok = false;
  try {
    const r = await fetch(`/api/cases/${token}/analyze`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lang }) });
    if (!r.ok || !r.body) throw new Error((await r.json().catch(() => ({}))).error || 'Something went wrong.');
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      for (let i; (i = buf.indexOf('\n')) >= 0;) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const m = JSON.parse(line);
        if (m.error) throw new Error(m.error);
        if (st?.token !== token) return;
        Object.assign(st.analysis, m.data);
        st.pending = st.pending.filter((p) => p !== m.part);
        renderPage();
      }
    }
    ok = true;
  } catch (e) {
    if (st?.token !== token) return;
    st.err = e.message;
    if (!Object.keys(st.analysis).length) st.analysis = null;
  }
  if (st?.token !== token) return;
  st.pending = []; st.aState = ok ? 'fresh' : 'stale'; renderPage();
}

function toJpeg(file, maxDim = 1800, q = 0.85) {
  return createImageBitmap(file).then((bmp) => {
    const s = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  }).catch(() => { throw new Error(t('cantOpen', file.name)); });
}

function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = base + 'pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; res(pdfjsLib); };
    s.onerror = () => rej(new Error(t('pdfLibFail')));
    document.head.appendChild(s);
  });
}

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(t('pdfFail'))), ms))]);

// Reads only the text layer of a PDF. The pages are not drawn, because drawing can hang in some browsers.
// A scanned PDF has no text layer, and then the whole file goes to the model instead.
async function pdfText(file) {
  try {
    const lib = await loadPdfJs();
    const pdf = await withTimeout(lib.getDocument({ data: await file.arrayBuffer(), isImageDecoderSupported: false }).promise, 15000);
    const n = Math.min(pdf.numPages, MAX_PAGES), texts = [];
    for (let p = 1; p <= n; p++) {
      const tc = await withTimeout((await pdf.getPage(p)).getTextContent(), 15000);
      texts.push(tc.items.map((it) => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g, ' ').trim());
    }
    let text = texts.join('\n\f\n');
    if (text.replace(/\s/g, '').length < 80 * n) text = '';
    return { text, cut: pdf.numPages > MAX_PAGES };
  } catch { return { text: '', cut: false }; }
}

const fileToDataUrl = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error(t('cantOpen', file.name))); r.readAsDataURL(file); });

function localIso() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

// Personal ID numbers we recognize: Norwegian national ID (11 digits), US Social Security number, Norwegian bank account.
const ID_RE = /\b\d{6}\s?\d{5}\b|\b\d{3}-\d{2}-\d{4}\b|\b\d{4}\.\d{2}\.\d{5}\b/g;
const redact = (s) => String(s ?? '').replace(ID_RE, t('idHidden'));

async function startIntake(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  const pdfs = files.filter((f) => f.type === 'application/pdf'), imgs = files.filter((f) => f.type.startsWith('image/'));
  if (pdfs.length + imgs.length !== files.length) return toast(t('onlyImagesPdf'));
  if (pdfs.length > 1 || (pdfs.length && imgs.length)) return toast(t('oneAtATime'));
  if (pdfs[0] && pdfs[0].size > 14e6) return toast(t('pdfTooBig'));
  intake = { phase: 'reading', source: pdfs.length ? 'pdf' : 'bilde', files, pages: [], fileIds: [], form: null, error: '', cut: false, pdfUrl: pdfs.length ? URL.createObjectURL(pdfs[0]) : '' };
  renderIntake(); $('#intake').showModal();
  await runRead();
}

async function runRead() {
  const it = intake, token = st.token;
  it.phase = 'reading'; it.error = ''; renderIntake();
  try {
    let body;
    if (it.source === 'pdf') {
      const r = await pdfText(it.files[0]); it.cut = r.cut;
      body = { pdf: await fileToDataUrl(it.files[0]), text: r.text, lang };
    } else {
      if (it.files.length > MAX_PAGES) it.cut = true;
      const images = await Promise.all(it.files.slice(0, MAX_PAGES).map((f) => toJpeg(f)));
      it.pages = images; renderIntake();
      body = { images, text: '', lang };
    }
    const out = await api('POST', `/api/cases/${token}/read`, body);
    if (intake !== it) return;
    it.fileIds = out.files;
    it.form = { title: out.forslag.tittel, type: out.forslag.type, date: out.forslag.dato, received: '', text: out.text };
    it.phase = 'ready';
  } catch (e) {
    if (intake !== it) return;
    it.phase = 'error'; it.error = e.message;
  }
  renderIntake();
}

const MONTH_RE = 'januar|februar|mars|april|mai|juni|juli|august|september|oktober|november|desember|january|february|march|may|june|july|october|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec';
const FLAG_PATTERNS = [
  new RegExp(`\\b\\d{1,2}\\.\\s?(?:${MONTH_RE})\\s?\\d{4}\\b`, 'gi'),
  new RegExp(`\\b(?:${MONTH_RE})\\.?\\s\\d{1,2}(?:st|nd|rd|th)?,?\\s\\d{4}\\b`, 'gi'),
  new RegExp(`\\b\\d{1,2}(?:st|nd|rd|th)?\\s(?:${MONTH_RE})\\.?,?\\s\\d{4}\\b`, 'gi'),
  /\b\d{1,2}\.\d{1,2}\.\d{2,4}\b/g,
  /\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/g,
  /\b\d{4}-\d{2}-\d{2}\b/g,
  /\$\s?\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?/g,
  /\bkr\.?\s?\d{1,3}(?:[  .]\d{3})*(?:,\d{1,2})?/gi,
  /\b\d{1,3}(?:[  .]\d{3})*(?:,\d{1,2})?\s?(?:kr|kroner|NOK)\b/gi,
  /\b[A-ZÆØÅ]{1,6}[-/]\d[\dA-Z-/]{2,}\b/g,
];
function renderChips() {
  const el = $('#chips'); if (!el) return;
  const tx = $('#i-text').value, seen = new Map(), unread = (tx.match(ILLEGIBLE) || []).length;
  for (const re of FLAG_PATTERNS) for (const m of tx.matchAll(re)) seen.set(m[0].trim(), m[0].trim());
  // The speech model sometimes says a word twice. Point it out, so the user can fix it.
  for (const m of tx.matchAll(/\b(\p{L}{2,})\s+\1\b/giu)) seen.set(m[0], t('repeated', m[0]));
  el.innerHTML = (unread ? `<div class="notice" style="width:100%">${icon('alert')}<div>${esc(t('inIllegible', unread))}</div></div>` : '')
    + [...seen].slice(0, 14).map(([find, label]) => `<button type="button" data-act="chip" data-id="${esc(find)}">${esc(label)}</button>`).join('');
}

function renderIntake() {
  const it = intake, d = $('#intake'); if (!it) return;
  if (it.source === 'tale') return renderVoice();
  const pages = it.pages.length ? `<div class="pages">${it.pages.map((p, i) => `<img src="${p}" alt="${esc(t('pageAlt', i + 1))}">`).join('')}</div>` : '';
  const pdfPanel = it.pdfUrl ? `<div class="pdfbox">${icon('file', 36)}<p><strong>${esc(it.files[0].name)}</strong></p><p class="meta">${esc(t('pdfPreviewNote'))}</p><a class="btn" href="${it.pdfUrl}" target="_blank" rel="noopener">${esc(t('openPdf'))}</a></div>` : '';
  let right = '';
  if (it.phase === 'reading') right = `<p class="skeleton" role="status">${esc(it.pages.length || it.source === 'pdf' ? t('inReading') : t('inPreparing'))}</p>`;
  else if (it.phase === 'error') right = `<div class="notice bad" role="alert">${icon('alert')}<div>${esc(it.error)}</div></div><div class="row" style="margin-top:16px"><button class="btn primary" data-act="i-retry">${esc(t('retry'))}</button><button class="btn" data-act="i-cancel">${esc(t('cancel'))}</button></div>`;
  else {
    const f = it.form;
    right = `${it.cut ? `<div class="notice" style="margin-bottom:16px">${icon('info')}<div>${esc(t('inCut', MAX_PAGES))}</div></div>` : ''}
      <label for="i-title" style="margin-top:0">${esc(t('titleLabel'))}</label><input id="i-title" value="${esc(f.title)}">
      <label for="i-type">${esc(t('typeLabel'))}</label><select id="i-type">${TYPES.map((x) => `<option value="${x}" ${x === f.type ? 'selected' : ''}>${esc(typeLabel(x))}</option>`).join('')}</select>
      <label for="i-date">${esc(t('dateOnLetter'))}</label><input id="i-date" type="date" value="${esc(f.date)}">
      <label for="i-received">${esc(t('dateReceived'))}</label><input id="i-received" type="date" value="${esc(f.received)}">
      <p class="meta" style="margin-top:6px">${esc(t('inReceivedHint'))}</p>
      <label for="i-text">${esc(t('inTextWeRead'))}</label><textarea id="i-text" class="big">${esc(f.text.replace(/\f/g, '\n\f'))}</textarea>
      <p style="margin-top:12px">${t('inCheckThese')}</p>
      <div class="chips" id="chips"></div>
      <div class="row" style="margin-top:24px"><button class="btn primary" data-act="i-save">${esc(t('inSave'))}</button><button class="btn" data-act="i-cancel">${esc(t('cancel'))}</button></div>`;
  }
  d.innerHTML = `<div class="row between"><h2>${esc(t('inTitle'))}</h2><button class="btn" data-act="i-cancel" aria-label="${esc(t('close'))}">${icon('x', 18)}</button></div>
    <div class="intake"><div>${pages || pdfPanel}</div><div>${right}</div></div>`;
  renderChips();
}

/* ---------- Voice note ---------- */
const REC_RATE = 24000, REC_MAX = 300;
let rec = null;

function abortRec() {
  if (!rec) return;
  clearInterval(rec.timer); rec.stream.getTracks().forEach((tr) => tr.stop()); try { rec.node.disconnect(); rec.ctx.close(); } catch {}
  rec = null;
}

function startVoice() {
  intake = { source: 'tale', phase: 'idle', secs: 0, form: null, fileIds: [], error: '' };
  renderIntake(); $('#intake').showModal();
}

async function beginRec() {
  const it = intake;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const url = URL.createObjectURL(new Blob(['class R extends AudioWorkletProcessor{process(i){const c=i[0][0];if(c)this.port.postMessage(c.slice());return true}}registerProcessor("r",R)'], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url); URL.revokeObjectURL(url);
    const node = new AudioWorkletNode(ctx, 'r'), chunks = [];
    node.port.onmessage = (e) => chunks.push(e.data);
    ctx.createMediaStreamSource(stream).connect(node);
    const start = Date.now();
    rec = { stream, ctx, node, chunks, timer: setInterval(() => {
      it.secs = Math.floor((Date.now() - start) / 1000);
      const el = $('#rec-time'); if (el) el.textContent = fmtTime(it.secs);
      if (it.secs >= REC_MAX) { toast(t('recTooLong')); endRec(); }
    }, 250) };
    it.phase = 'recording'; renderIntake();
  } catch { it.phase = 'error'; it.error = t('recMicFail'); renderIntake(); }
}

// Resamples to 24 kHz, 16-bit mono, and wraps it as a WAV file (base64), which is what the API accepts.
function floatsToWav(chunks, n, rate) {
  const all = new Float32Array(n); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const ratio = rate / REC_RATE, len = Math.floor(n / ratio), pcm = new Int16Array(len);
  for (let i = 0; i < len; i++) {
    const pos = i * ratio, i0 = Math.floor(pos), f = pos - i0, s = all[i0] * (1 - f) + (all[i0 + 1] ?? all[i0]) * f;
    pcm[i] = Math.max(-1, Math.min(1, s)) * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf), w = (off, s) => [...s].forEach((ch, k) => v.setUint8(off + k, ch.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, REC_RATE, true); v.setUint32(28, REC_RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  const bytes = new Uint8Array(buf); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

async function endRec() {
  const it = intake; if (!rec || !it) return;
  const { chunks } = rec, rate = rec.ctx.sampleRate, n = chunks.reduce((a, c) => a + c.length, 0);
  abortRec();
  if (n / rate < 1) { it.phase = 'idle'; renderIntake(); return toast(t('recTooShort')); }
  it.phase = 'reading'; renderIntake();
  try {
    const out = await api('POST', `/api/cases/${st.token}/voice`, { wav: floatsToWav(chunks, n, rate) });
    if (intake !== it) return;
    it.form = { title: t('recDefaultTitle', fmtShort(localIso())), type: 'notat', date: localIso(), received: '', text: out.text };
    it.phase = 'ready';
  } catch (e) { if (intake !== it) return; it.phase = 'error'; it.error = e.message; }
  renderIntake();
}

function renderVoice() {
  const it = intake, d = $('#intake');
  let body;
  if (it.phase === 'idle') body = `<p style="margin-top:12px">${esc(t('recIntro'))}</p><p style="margin-top:20px"><button class="btn primary" data-act="rec-start">${icon('mic', 18)} ${esc(t('recStart'))}</button></p>`;
  else if (it.phase === 'recording') body = `<p class="rec-live" role="status" style="margin-top:12px"><span class="rec-dot" aria-hidden="true"></span>${esc(t('recRecording'))} <strong id="rec-time">${fmtTime(it.secs)}</strong></p><p style="margin-top:20px"><button class="btn primary" data-act="rec-stop">${esc(t('recStop'))}</button></p>`;
  else if (it.phase === 'reading') body = `<p class="skeleton" role="status" style="margin-top:12px">${esc(t('recTranscribing'))}</p>`;
  else if (it.phase === 'error') body = `<div class="notice bad" role="alert" style="margin-top:12px">${icon('alert')}<div>${esc(it.error)}</div></div><div class="row" style="margin-top:16px"><button class="btn primary" data-act="rec-again">${esc(t('retry'))}</button><button class="btn" data-act="i-cancel">${esc(t('cancel'))}</button></div>`;
  else {
    const f = it.form;
    body = `<div class="notice" style="margin-top:12px">${icon('info')}<div>${esc(t('recCaveat'))}</div></div>
      <label for="i-title">${esc(t('titleLabel'))}</label><input id="i-title" value="${esc(f.title)}">
      <label for="i-date">${esc(t('dateOnLetter'))}</label><input id="i-date" type="date" value="${esc(f.date)}">
      <label for="i-text">${esc(t('recReview'))}</label><textarea id="i-text" class="big">${esc(f.text)}</textarea>
      <div class="chips" id="chips"></div>
      <div class="row" style="margin-top:24px"><button class="btn primary" data-act="i-save">${esc(t('inSave'))}</button><button class="btn" data-act="i-cancel">${esc(t('cancel'))}</button></div>`;
  }
  d.innerHTML = `<div class="row between"><h2>${esc(t('recTitle'))}</h2><button class="btn" data-act="i-cancel" aria-label="${esc(t('close'))}">${icon('x', 18)}</button></div>${body}`;
  renderChips();
}

async function saveIntake() {
  const it = intake, text = $('#i-text').value.replace(/\n\f/g, '\f').trim();
  if (!text) return toast(t('inNoText'));
  try {
    await caseApi('POST', '/documents', { title: $('#i-title').value, type: $('#i-type')?.value || it.form.type, date: $('#i-date').value, received: $('#i-received')?.value || '', text, source: it.source, fileIds: it.fileIds });
  } catch (e) { return toast(e.message); }
  $('#intake').close(); intake = null;
  toast(t('inAdded'));
  await reloadCase();
  analyze();
}

/* ---------- Events ---------- */
function setLang(l) {
  lang = l; try { localStorage.setItem(LANG_KEY, l); } catch {}
  if (st) { if (st.c) document.title = `${st.c.name} · ${t('brand')}`; renderCase(); } else renderHome();
}

const acts = {
  'toggle-lang': () => setLang(lang === 'en' ? 'nb' : 'en'),
  record: () => startVoice(),
  'rec-start': () => beginRec(),
  'rec-stop': () => endRec(),
  'rec-again': () => { intake.phase = 'idle'; renderIntake(); },
  forget: (id) => { saker = saker.filter((s) => s.token !== id); saveSaker(); renderHome(); },
  'try-sample': async () => { const { token } = await api('POST', '/api/cases/sample', { lang }); remember(token, t('sampleName')); location.hash = `#/s/${token}`; },
  'toggle-simple': () => {
    simple = !simple; try { localStorage.setItem(SIMPLE_KEY, simple ? '1' : '0'); } catch {}
    if (st && !['del', 'overlevering'].includes(st.page)) st.page = 'oversikt';
    renderCase(); focusMain();
  },
  'toggle-claim': (id) => { st.open.has(id) ? st.open.delete(id) : st.open.add(id); renderPage(); document.querySelector(`[data-act="toggle-claim"][data-id="${CSS.escape(id)}"]`)?.focus(); },
  evidence: (id) => { st.ev.has(id) ? st.ev.delete(id) : st.ev.add(id); renderPage(); document.querySelector(`[data-act="evidence"][data-id="${CSS.escape(id)}"]`)?.focus(); },
  upload: () => $('#f-upload').click(),
  'paste-text': () => {
    $('#viewer').innerHTML = `<div class="row between"><h2>${esc(t('pasteTitle'))}</h2><button class="btn" data-act="close" data-id="viewer">${icon('x', 18)} ${esc(t('close'))}</button></div>
      <form data-form="paste"><label for="p-title">${esc(t('titleLabel'))}</label><input id="p-title" placeholder="${esc(t('titlePh'))}">
      <label for="p-type">${esc(t('typeLabel'))}</label><select id="p-type">${TYPES.map((x) => `<option value="${x}">${esc(typeLabel(x))}</option>`).join('')}</select>
      <label for="p-date">${esc(t('dateOnLetter'))}</label><input id="p-date" type="date">
      <label for="p-received">${esc(t('dateReceived'))}</label><input id="p-received" type="date">
      <label for="p-text">${esc(t('textLabel'))}</label><textarea id="p-text" class="big" required></textarea>
      <div class="row" style="margin-top:24px"><button class="btn primary" type="submit">${esc(t('addToCase'))}</button></div></form>`;
    $('#viewer').showModal(); $('#p-title').focus();
  },
  analyze: () => analyze(),
  'open-doc': (id, el) => openDoc(id, el?.dataset.quote || ''),
  'edit-doc': (id) => openDoc(id, '', true),
  'save-edit': async (id) => {
    const d = docById(id), text = $('#v-edit').value.trim(); if (!text) return toast(t('textEmpty'));
    await caseApi('PUT', `/documents/${id}`, { title: d.title, type: d.type, date: d.date, received: d.received, text, source: d.source });
    await reloadCase(); openDoc(id, ''); toast(t('textSaved'));
  },
  'del-doc': async (id) => {
    if (!confirm(t('deleteDocConfirm'))) return;
    await caseApi('DELETE', `/documents/${id}`); $('#viewer').close(); await reloadCase();
  },
  'd-klage': () => guarded(t('busyDraft'), async () => { st.draft = (await caseApi('POST', '/draft', { kind: 'klage', docId: $('#d-doc').value, lang })).tekst; }),
  'd-over': () => guarded(t('busySummary'), async () => { st.draft = (await caseApi('POST', '/draft', { kind: 'overlevering', lang })).tekst; }),
  copy: (id, el) => navigator.clipboard?.writeText(st.draft).then(() => { el.textContent = t('copied'); }),
  share: async () => {
    const url = `${location.origin}/#/s/${st.token}`;
    try { await navigator.clipboard.writeText(url); toast(t('linkCopied')); }
    catch { $('#sharelink')?.select(); toast(t('selectLink')); }
  },
  rename: async () => {
    const name = prompt(t('renamePrompt'), st.c.name); if (!name?.trim()) return;
    await caseApi('PUT', '', { name: name.trim(), person: st.c.person }); remember(st.token, name.trim()); await reloadCase();
  },
  'delete-case': async () => {
    if (!confirm(t('deleteCaseConfirm'))) return;
    await caseApi('DELETE'); saker = saker.filter((s) => s.token !== st.token); saveSaker(); location.hash = '#/';
  },
  print: () => window.print(),
  close: (id) => $('#' + id).close(),
  chip: (id) => {
    const ta = $('#i-text'), i = ta.value.indexOf(id); if (i < 0) return;
    ta.focus(); ta.setSelectionRange(i, i + id.length);
    ta.scrollTop = Math.max(0, (ta.value.slice(0, i).split('\n').length - 3) * 26);
  },
  'i-save': () => saveIntake(),
  'i-retry': () => runRead(),
  'i-cancel': () => { abortRec(); $('#intake').close(); intake = null; },
};

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = acts[el.dataset.act]; if (!fn) return;
  try { await fn(el.dataset.id, el); } catch (err) { toast(err.message); }
});

document.addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  try {
    if (f.dataset.form === 'new-case') {
      const name = $('#newname').value.trim() || t('defaultCaseName');
      const { token } = await api('POST', '/api/cases', { name }); remember(token, name); location.hash = `#/s/${token}`;
    } else if (f.dataset.form === 'received') {
      await setReceived(f.dataset.id, f.querySelector('input').value);
    } else if (f.dataset.form === 'ask') {
      const q = $('#q').value.trim(); if (q) await guarded(t('busyAsk'), async () => { st.answer = await caseApi('POST', '/ask', { question: q, lang }); });
    } else if (f.dataset.form === 'paste') {
      const text = $('#p-text').value.trim(); if (!text) return toast(t('pasteEmpty'));
      await caseApi('POST', '/documents', { title: $('#p-title').value, type: $('#p-type').value, date: $('#p-date').value, received: $('#p-received').value, text, source: 'tekst' });
      $('#viewer').close(); await reloadCase(); analyze();
    }
  } catch (err) { toast(err.message); }
});

document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.id === 'f-upload') { const files = el.files; await startIntake(files); el.value = ''; }
  else if (el.dataset?.check !== undefined) await setCheck(el.dataset.check, el.checked, el.id);
  else if (el.id === 'hide-ids') { st.hideIds = el.checked; renderPage(); document.getElementById('hide-ids')?.focus(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'i-text') renderChips(); });

document.addEventListener('dragover', (e) => { const z = e.target.closest('#dropzone'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { e.target.closest?.('#dropzone')?.classList.remove('over'); });
document.addEventListener('drop', async (e) => {
  const z = e.target.closest('#dropzone'); if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  await startIntake(e.dataTransfer.files);
});

$('#intake').addEventListener('close', abortRec);
$('#intake').addEventListener('cancel', (e) => { if (intake?.phase === 'ready' && !confirm(t('inDiscard'))) e.preventDefault(); });

route();
</script>
