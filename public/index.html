<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Saksmappen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Source+Serif+4:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF9F6; --surface: #FFFFFF; --line: #E5E1D8; --ink: #162232; --muted: #4A5668;
  --primary: #1E3A5F; --ok: #14714A; --ok-bg: #E8F3EE;
  --warn: #9A6B00; --warn-ink: #7A5500; --warn-bg: #FFF4D6;
  --bad: #B42318; --bad-bg: #FCECEA; --mark: #FFF1A8; --quote-bg: #F3F2EE; --ctl: #6B7686; --neutral-bg: #EEECE6;
  --r: 12px;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 "Public Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; margin: 0; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.375rem; }
h3 { font-size: 1.125rem; }
h4 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--primary); }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--primary); color: #fff; padding: 12px 16px; border-radius: 8px; z-index: 20; }
.skip:focus { left: 8px; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: 6px; }
.meta { font-size: .875rem; color: var(--muted); }
.lead { font-size: 1.125rem; color: var(--ink); max-width: 62ch; }
.eyebrow { font-size: .875rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; text-transform: none; }
.stack > * + * { margin-top: 24px; }
.stack-s > * + * { margin-top: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.ic { flex: none; vertical-align: middle; }

/* Topp */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; min-height: 72px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1.125rem; color: var(--primary); text-decoration: none; min-height: 44px; }
.casename { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 16px; border-left: 1px solid var(--line); }
.top-actions { display: flex; gap: 16px; align-items: center; margin-left: auto; flex-wrap: wrap; }
@media (max-width: 640px) {
  .top-in { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "brand share" "name switch"; gap: 4px 12px; min-height: 0; padding-top: 8px; padding-bottom: 8px; }
  .top-actions { display: contents; }
  .brand { grid-area: brand; }
  .casename { grid-area: name; border-left: 0; padding-left: 0; }
  .switch { grid-area: switch; }
  .top-actions .btn { grid-area: share; justify-self: end; }
}
.switch { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; border: 0; background: none; font: inherit; color: var(--ink); cursor: pointer; padding: 0; }
.switch .track { width: 44px; height: 26px; border-radius: 999px; background: var(--ctl); position: relative; transition: background .15s; flex: none; }
.switch .thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] .track { background: var(--primary); }
.switch[aria-checked="true"] .thumb { transform: translateX(18px); }
@media (prefers-reduced-motion: reduce) { .switch .track, .switch .thumb { transition: none; } }

.tabs { background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs ul { display: flex; gap: 4px; list-style: none; margin: 0 auto; padding: 0 20px; max-width: 880px; }
.tabs a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 14px; color: var(--ink); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { background: var(--quote-bg); }
.tabs a[aria-current="page"] { border-bottom-color: var(--primary); font-weight: 600; color: var(--primary); }
.tabs a:focus-visible { outline-offset: -3px; }

main { padding-top: 32px; padding-bottom: 96px; }
main:focus { outline: none; }

/* Knapper og skjema */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 20px; border-radius: 10px; border: 1.5px solid var(--primary); background: var(--surface); color: var(--primary); font-family: inherit; font-weight: 600; font-size: 1rem; line-height: 1.2; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--quote-bg); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { background: #17304F; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; font-family: inherit; font-weight: 600; font-size: 1rem; line-height: 1.3; color: var(--primary); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
label { display: block; font-size: .9375rem; font-weight: 600; margin: 16px 0 6px; }
input, select, textarea { width: 100%; min-height: 48px; padding: 10px 14px; border: 1.5px solid var(--ctl); border-radius: 10px; background: #fff; color: var(--ink); font: inherit; }
textarea { min-height: 120px; resize: vertical; }
textarea.big { min-height: 280px; }
.copyrow { display: flex; gap: 12px; flex-wrap: wrap; }
.copyrow input { flex: 1; min-width: 220px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
.card.center { text-align: center; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); border: 1px solid #E8D49A; }
.notice.bad { background: var(--bad-bg); color: var(--bad); border-color: #E7B8B2; }
.notice > div { color: var(--ink); }
.notice .ic { margin-top: 3px; }

/* Merker */
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: .875rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; line-height: 1.4; }
.badge.ok { color: var(--ok); background: var(--ok-bg); }
.badge.warn { color: var(--warn-ink); background: var(--warn-bg); }
.badge.bad { color: var(--bad); background: var(--bad-bg); }
.badge.neutral { color: var(--ink); background: var(--neutral-bg); }

/* Den verifiserte påstanden */
.claim { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: var(--r); padding: 20px 24px; }
.claim.is-bad { border: 1.5px solid var(--bad); border-left-width: 4px; }
.claim-text { font-size: 1.125rem; font-weight: 600; margin: 12px 0 4px; line-height: 1.35; }
.claim-detail { color: var(--ink); margin-top: 4px; }
.quote { margin: 12px 0 0; padding: 12px 16px; background: var(--quote-bg); border-radius: 8px; font: italic 400 1.0625rem/1.6 "Source Serif 4", Georgia, serif; }
.src { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-top: 12px; font-size: .875rem; color: var(--muted); }
.evidence { margin-top: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.evidence h4 { margin-bottom: 8px; }
.excerpt { white-space: pre-wrap; background: var(--surface); }
mark { background: var(--mark); color: var(--ink); padding: 1px 2px; border-radius: 3px; }
.evidence figure { margin: 16px 0 0; }
.evidence img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
.evidence figcaption { margin-top: 6px; }
.claim-toggle { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0; border: 0; background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.claim-toggle .when { font-size: .875rem; color: var(--muted); min-width: 64px; flex: none; }
.claim-toggle .ttl { flex: 1; font-weight: 600; font-size: 1.0625rem; line-height: 1.35; }
.claim-toggle .chev { transition: transform .15s; flex: none; }
.claim-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.claim-body { margin-top: 12px; }

/* Oversikt */
.att-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .att-grid { grid-template-columns: repeat(3, 1fr); } }
.att { display: flex; flex-direction: column; gap: 12px; }
.att .grow { flex: 1; }
.bigdate { font-size: 2rem; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
.bignum { font-size: 2rem; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
.progress { height: 10px; border-radius: 999px; background: var(--neutral-bg); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.plain-list { margin: 0; padding-left: 20px; }
.plain-list li { margin: 4px 0; }
.trust { display: flex; gap: 16px; align-items: flex-start; }
.trust .ic { margin-top: 4px; color: var(--ok); }
.trust.some-bad .ic { color: var(--bad); }
.skeleton { color: var(--muted); }

/* Tidslinje */
.timeline { list-style: none; margin: 0 0 0 8px; padding: 0 0 0 28px; border-left: 2px solid var(--line); }
.timeline > li { position: relative; padding-bottom: 20px; }
.timeline > li:last-child { padding-bottom: 0; }
.timeline > li::before { content: ""; position: absolute; left: -37px; top: 22px; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); border: 3px solid var(--bg); }

/* Dokumenter */
.drop { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 32px 24px; border: 2px dashed var(--ctl); border-radius: var(--r); background: var(--surface); cursor: pointer; width: 100%; font: inherit; color: var(--ink); }
.drop:hover, .drop.over { background: var(--quote-bg); border-color: var(--primary); }
.drop strong { font-size: 1.125rem; }
.drop .ic { color: var(--primary); }
.docrow { display: flex; gap: 16px; align-items: center; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-align: left; width: 100%; font: inherit; color: var(--ink); cursor: pointer; min-height: 88px; }
.docrow:hover { background: var(--quote-bg); }
.docrow .grow { flex: 1; min-width: 0; }
.docrow strong { display: block; line-height: 1.3; }
.thumb { width: 56px; height: 72px; border-radius: 6px; border: 1px solid var(--line); background: var(--quote-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }

/* Frister */
.calc { display: flex; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; margin: 12px 0 4px; padding: 16px; background: var(--quote-bg); border-radius: 10px; }
.calc dt { font-size: .875rem; color: var(--muted); }
.calc dd { margin: 0; font-weight: 600; font-size: 1.125rem; }
.calc .res dd { font-size: 1.375rem; }
.calc .op { font-size: 1.375rem; color: var(--muted); padding-bottom: 2px; }

/* Mangler */
.check { display: flex; gap: 16px; align-items: flex-start; padding: 20px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check input[type="checkbox"] { width: 24px; height: 24px; min-height: 24px; margin: 8px 0 0; padding: 0; accent-color: var(--primary); flex: none; cursor: pointer; }
.check .ck-title { display: block; margin: 0; padding: 6px 0; font-size: 1.0625rem; font-weight: 600; cursor: pointer; min-height: 44px; }
.check.done .ck-title { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--muted); }
.check .grow { flex: 1; min-width: 0; }

/* Enkel visning */
body.simple main { font-size: 1.25rem; line-height: 1.75; color: #0B1620; }
body.simple h1 { font-size: 2.25rem; }
body.simple h2 { font-size: 1.625rem; margin: 48px 0 12px; }
body.simple .simple-list { padding-left: 28px; }
body.simple .simple-list li { margin: 16px 0; padding-left: 4px; }
body.simple .btn { font-size: 1.125rem; min-height: 52px; }
body.simple .meta { font-size: 1rem; }

/* Dialoger */
dialog { max-width: 960px; width: calc(100% - 24px); max-height: calc(100vh - 24px); overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); padding: 24px; }
dialog::backdrop { background: rgba(22, 34, 50, .55); }
.intake { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 16px; }
.intake > div:first-child { position: sticky; top: 0; align-self: start; }
@media (max-width: 820px) { .intake { grid-template-columns: 1fr; } .intake > div:first-child { position: static; } }
.pages { max-height: 70vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--quote-bg); }
.pages img, details.orig img { width: 100%; display: block; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; background: #fff; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chips button { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E8D49A; background: var(--warn-bg); color: var(--warn-ink); font-family: inherit; font-weight: 600; font-size: .9375rem; line-height: 1; cursor: pointer; }
pre.text { white-space: pre-wrap; font: inherit; margin: 12px 0 0; max-height: 50vh; overflow: auto; background: var(--quote-bg); padding: 16px; border-radius: 10px; }
details.orig { margin-top: 12px; }
details.orig summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; color: var(--primary); }
.out { white-space: pre-wrap; background: var(--quote-bg); border-radius: 10px; padding: 20px; margin-top: 16px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; z-index: 30; }
#toast.on { opacity: 1; }

/* Overlevering og utskrift */
.handover section { margin-top: 32px; }
.handover .claim { break-inside: avoid; }
@media print {
  body { background: #fff; font-size: 12pt; }
  .top, .tabs, .noprint, .skip, #toast { display: none !important; }
  main { padding: 0; }
  .wrap { max-width: none; padding: 0; }
  .claim, .card { break-inside: avoid; box-shadow: none; }
  a { color: inherit; text-decoration: none; }
}
</style>
</head>
<body>
<a class="skip" href="#app">Hopp til innholdet</a>
<header class="top"><div class="wrap top-in" id="top"></div></header>
<nav class="tabs" id="tabs" aria-label="Sakens deler" hidden></nav>
<main class="wrap" id="app" tabindex="-1"></main>
<dialog id="viewer" aria-label="Dokument"></dialog>
<dialog id="intake" aria-label="Sjekk dokumentet"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Grunnlag ---------- */
const LS_KEY = 'saksmappen_saker_v2', SIMPLE_KEY = 'saksmappen_enkel';
const TYPES = ['vedtak', 'legeerklæring', 'forsikring', 'advokat', 'innkalling', 'notat', 'annet'];
const PAGES = ['oversikt', 'tidslinje', 'dokumenter', 'frister', 'mangler', 'skriv', 'del', 'overlevering'];
const TABS = [['oversikt', 'Oversikt'], ['tidslinje', 'Tidslinje'], ['dokumenter', 'Dokumenter'], ['frister', 'Frister'], ['mangler', 'Mangler'], ['skriv', 'Spør og skriv']];
const MAX_PAGES = 6;

const ICONS = {
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  'calendar-plus': '<path d="M8 2v4"/><path d="M16 2v4"/><path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/><path d="M3 10h18"/><path d="M16 19h6"/><path d="M19 16v6"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  printer: '<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
};
const icon = (n, size = 20) => `<svg class="ic" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;
const badge = (kind, ic, text) => `<span class="badge ${kind}">${icon(ic, 16)}<span>${esc(text)}</span></span>`;

let saker = [];
try { saker = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch {}
let simple = false;
try { simple = localStorage.getItem(SIMPLE_KEY) === '1'; } catch {}
let st = null;      // åpen sak
let intake = null;  // pågående dokumentinntak

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = (s) => { s = String(s ?? ''); return s.charAt(0).toUpperCase() + s.slice(1); };
const capEsc = (s) => esc(cap(s));
const plural = (n, one, many) => (n === 1 ? one : many);
const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
const daysUntil = (iso) => Math.round((new Date(iso + 'T12:00:00') - today()) / 864e5);
const fmtLong = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' }) : 'ukjent dato';
const fmtShort = (d) => {
  if (!d) return 'ukjent dato';
  const dt = new Date(d + 'T12:00:00'), o = { day: 'numeric', month: 'short' };
  if (dt.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return dt.toLocaleDateString('nb-NO', o);
};
const docById = (id) => st?.docs.find((d) => d.id === id);
const ck = (hva) => String(hva).toLowerCase().replace(/\s+/g, ' ').trim().slice(0, 160);

function saveSaker() { try { localStorage.setItem(LS_KEY, JSON.stringify(saker)); } catch {} }
function remember(token, name) { saker = [{ token, name }, ...saker.filter((s) => s.token !== token)]; saveSaker(); }

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 5000);
}

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: 'Uventet svar fra serveren.' }));
  if (!r.ok || j.error) throw new Error(j.error || 'Noe gikk galt.');
  return j;
}
const caseApi = (method, sub = '', body) => api(method, `/api/cases/${st.token}${sub}`, body);

/* ---------- Den verifiserte påstanden ---------- */
function locate(text, quote) {
  if (!quote) return null;
  const tokens = quote.trim().split(/\s+/).map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  try {
    const m = new RegExp(tokens.join('[\\s\\f]+'), 'i').exec(text);
    return m ? { i: m.index, len: m[0].length } : null;
  } catch { return null; }
}

function pageOf(d, quote) {
  if (!d || (!d.text.includes('\f') && (d.files?.length || 0) <= 1)) return null;
  const loc = locate(d.text, quote);
  return loc ? d.text.slice(0, loc.i).split('\f').length : null;
}

function evidenceHtml(d, quote) {
  const loc = locate(d.text, quote), pg = pageOf(d, quote);
  let body;
  if (loc) {
    const a = Math.max(0, loc.i - 260), b = Math.min(d.text.length, loc.i + loc.len + 260), clean = (s) => esc(s.replace(/\f/g, ''));
    body = `<p class="excerpt">${a > 0 ? '… ' : ''}${clean(d.text.slice(a, loc.i))}<mark>${clean(d.text.slice(loc.i, loc.i + loc.len))}</mark>${clean(d.text.slice(loc.i + loc.len, b))}${b < d.text.length ? ' …' : ''}</p>`;
  } else body = `<p>Vi fant ikke sitatet ordrett i teksten vi leste. Åpne dokumentet og les selv.</p>`;
  const img = d.files?.length
    ? `<figure><img loading="lazy" src="/api/cases/${st.token}/files/${esc(d.files[Math.min((pg || 1) - 1, d.files.length - 1)])}" alt="Original av ${esc(d.title)}${pg ? `, side ${pg}` : ''}"><figcaption class="meta">Originalen${pg ? `, side ${pg}` : ''}. Det gule er markert i teksten vi leste fra brevet.</figcaption></figure>` : '';
  return `<div class="evidence"><h4>Slik står det i dokumentet</h4>${body}${img}<p style="margin-top:8px"><button class="btn-link" data-act="open-doc" data-id="${esc(d.id)}" data-quote="${esc(quote || '')}">Åpne hele dokumentet</button></p></div>`;
}

// id: unik nøkkel for visningstilstand. collapsed: tidslinje-stil, åpnes med påstanden som knapp.
function claimCard({ id, claim = '', detail = '', quote = '', dok, verified, collapsed = false, date = '', top = '', after = '' }) {
  const d = docById(dok), open = st.open.has(id), showEv = st.ev.has(id);
  const vb = verified ? badge('ok', 'check', 'Kontrollert mot dokumentet') : badge('bad', 'alert', 'Kunne ikke kontrolleres. Sjekk selv');
  const pg = d && quote ? pageOf(d, quote) : null;
  const src = d ? `${esc(d.title)} · ${fmtShort(d.date)}${pg ? ` · Side ${pg}` : ''}` : 'Ukjent dokument';
  const inner = `
    ${top}${detail ? `<p class="claim-detail">${esc(detail)}</p>` : ''}
    ${quote ? `<blockquote class="quote">«${esc(quote)}»</blockquote>` : ''}
    ${d ? `<div class="src"><span>${src}</span><button class="btn-link" data-act="evidence" data-id="${esc(id)}" aria-expanded="${showEv}">${showEv ? 'Skjul' : 'Se i dokumentet'} ${icon(showEv ? 'x' : 'arrow', 16)}</button></div>` : ''}
    ${showEv && d ? evidenceHtml(d, quote) : ''}${after}`;
  if (collapsed) {
    return `<article class="claim ${verified ? '' : 'is-bad'}">
      <button class="claim-toggle" data-act="toggle-claim" data-id="${esc(id)}" aria-expanded="${open}" aria-controls="cb-${esc(id)}">
        <span class="when">${esc(fmtShort(date))}</span><span class="ttl">${capEsc(claim)}</span>${icon('chevron', 20).replace('class="ic"', 'class="ic chev"')}
      </button>
      <div class="claim-body" id="cb-${esc(id)}" ${open ? '' : 'hidden'}>${vb}${inner}</div></article>`;
  }
  return `<article class="claim ${verified ? '' : 'is-bad'}">${vb}${claim ? `<h3 class="claim-text">${capEsc(claim)}</h3>` : ''}${inner}</article>`;
}

/* ---------- Uthenting av data fra analysen ---------- */
const A = () => st.analysis || {};
const datedFrister = () => (A().frister || []).filter((f) => f.dato).sort((x, y) => x.dato.localeCompare(y.dato));
const nextDeadline = () => datedFrister().find((f) => daysUntil(f.dato) >= 0) || null;
const needInfo = () => (A().frister || []).filter((f) => !f.dato);
const wait = (p) => st.pending.includes(p);
const icsIndex = (f) => datedFrister().indexOf(f);

function flatClaims() {
  const a = A();
  return [
    ...(a.tidslinje || []).map((x, i) => ({ id: `t${i}`, kind: 'tidslinje', claim: x.tittel, detail: x.beskrivelse, date: x.dato, ...pick(x) })),
    ...(a.frister || []).map((x, i) => ({ id: `f${i}`, kind: 'frister', claim: x.hva, date: x.dato, ...pick(x) })),
    ...(a.mangler || []).map((x, i) => ({ id: `m${i}`, kind: 'mangler', claim: x.hva, detail: x.hvorfor, ...pick(x) })),
  ];
}
const pick = (x) => ({ quote: x.sitat, dok: x.dok, verified: !!x.verifisert });

const dueBadge = (iso) => {
  const n = daysUntil(iso);
  if (n < 0) return badge('bad', 'alert', `Utløpt for ${-n} ${plural(-n, 'dag', 'dager')} siden`);
  if (n === 0) return badge('warn', 'alert', 'Fristen er i dag');
  if (n <= 14) return badge('warn', 'clock', `Om ${n} ${plural(n, 'dag', 'dager')}`);
  return badge('neutral', 'clock', `Om ${n} dager`);
};

function calcHtml(f) {
  const d = docById(f.dok);
  if (f.beregnet && f.varighet && d) {
    const fra = f.fra === 'mottak' ? ['Du mottok brevet', fmtShort(d.received)] : ['Datoen på brevet', fmtShort(d.date)];
    return `<dl class="calc" aria-label="Slik er fristen regnet ut">
      <div><dt>${fra[0]}</dt><dd>${esc(fra[1])}</dd></div><span class="op" aria-hidden="true">+</span>
      <div><dt>Fristen i brevet</dt><dd>${esc(f.varighet.antall)} ${esc(f.varighet.enhet)}</dd></div><span class="op" aria-hidden="true">=</span>
      <div class="res"><dt>Frist</dt><dd>${esc(fmtShort(f.dato))}</dd></div></dl>
      <p class="meta">Regnet ut av en vanlig kalkulator, ikke av AI. Sjekk om brevet oppgir en egen dato.</p>`;
  }
  if (f.dato && f.usikker) {
    return `<div class="notice" style="margin-top:12px">${icon('alert')}<div><strong>Datoen står ikke i dokumentet.</strong> ${esc(fmtLong(f.dato))} er regnet ut av AI, og er ikke kontrollert. Sjekk selv i brevet.</div></div>`;
  }
  if (f.dato) {
    return `<dl class="calc"><div class="res"><dt>Frist, slik det står i brevet</dt><dd>${esc(fmtShort(f.dato))}</dd></div></dl>`;
  }
  return `<div class="notice" style="margin-top:12px">${icon('info')}<div><strong>Vi trenger én dato fra deg.</strong> ${esc(f.regel || 'Fristen løper fra du mottok brevet.')}</div></div>`;
}

function receivedForm(f) {
  const d = docById(f.dok);
  if (!d || d.received) return '';
  return `<form class="stack-s" data-form="received" data-id="${esc(d.id)}" style="margin-top:12px">
    <label for="rc-${esc(d.id)}" style="margin-top:0">Når mottok du brevet?</label>
    <div class="row"><input id="rc-${esc(d.id)}" type="date" required style="width:auto;min-width:200px"><button class="btn primary" type="submit">Regn ut fristen</button></div></form>`;
}

function dropzone() {
  return `<button class="drop" data-act="upload" id="dropzone" type="button">${icon('camera', 36)}
    <strong>Ta bilde eller last opp PDF av brevet</strong>
    <span class="meta">Du kan også dra filen hit. Flere bilder blir sider i samme brev.</span></button>
    <input id="f-upload" type="file" accept="image/*,application/pdf" multiple hidden>`;
}

/* ---------- Ruting og ramme ---------- */
function route() {
  const m = location.hash.match(/^#\/s\/([A-Za-z0-9_-]+)(?:\/([a-z-]+))?$/);
  if (!m) return renderHome();
  const page = PAGES.includes(m[2]) ? m[2] : 'oversikt';
  if (st?.token === m[1]) { st.page = page; renderCase(); focusMain(); } else openCase(m[1], page);
}
addEventListener('hashchange', route);

function focusMain() { window.scrollTo(0, 0); const h = $('#app h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }

function renderChrome() {
  const brand = `<a class="brand" href="#/">${icon('folder', 24)}<span>Saksmappen</span></a>`;
  if (!st) { $('#top').innerHTML = brand; $('#tabs').hidden = true; return; }
  $('#top').innerHTML = `${brand}<div class="casename" title="${esc(st.c?.name || '')}">${esc(st.c?.name || 'Åpner saken…')}</div>
    <div class="top-actions">
      <button class="switch" role="switch" aria-checked="${simple}" data-act="toggle-simple"><span class="track"><span class="thumb"></span></span><span>Enkel visning</span></button>
      <a class="btn primary" href="#/s/${esc(st.token)}/del">${icon('share', 18)} Del saken</a>
    </div>`;
  const showTabs = !simple && !['del', 'overlevering'].includes(st.page);
  $('#tabs').hidden = !showTabs;
  $('#tabs').innerHTML = `<ul>${TABS.map(([k, l]) => `<li><a href="#/s/${esc(st.token)}/${k}" ${st.page === k ? 'aria-current="page"' : ''}>${l}</a></li>`).join('')}</ul>`;
}

/* ---------- Forside ---------- */
function renderHome() {
  st = null; document.title = 'Saksmappen'; document.body.classList.remove('simple');
  renderChrome();
  $('#app').innerHTML = `<div class="stack">
    <div class="stack-s"><h1>Saksmapper</h1><p class="lead">Samle brevene og dokumentene i en langvarig sak. Vi finner frister og det som mangler, og viser deg hvor vi har det fra.</p></div>
    <section class="card" aria-labelledby="h-saker"><h2 id="h-saker">Dine saker</h2>
      ${saker.length ? `<ul style="list-style:none;margin:16px 0 0;padding:0">${saker.map((s) => `<li class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><a class="btn-link" href="#/s/${esc(s.token)}">${esc(s.name)}</a><button class="btn-link" data-act="forget" data-id="${esc(s.token)}" title="Fjerner bare fra denne listen. Saken slettes ikke.">Fjern fra listen</button></li>`).join('')}</ul>` : '<p style="margin-top:8px" class="meta">Du har ingen saker ennå. Opprett den første under.</p>'}
      <form data-form="new-case"><label for="newname">Ny sak</label>
        <div class="copyrow"><input id="newname" placeholder="For eksempel: Mor, NAV og forsikring" autocomplete="off"><button class="btn primary" type="submit">Opprett saken</button></div></form>
      <p style="margin-top:12px"><button class="btn-link" data-act="try-sample">Se en fiktiv eksempelsak</button></p>
    </section>
    <section class="card" aria-labelledby="h-tillit"><h2 id="h-tillit">Slik kan du stole på det du ser</h2>
      <ul class="plain-list stack-s" style="margin-top:12px">
        <li>Hver ting vi finner har et sitat fra brevet.</li>
        <li>Vi sjekker at sitatet faktisk står i dokumentet. Finner vi det ikke, sier vi fra.</li>
        <li>Datoer regnes ut av en vanlig kalkulator, ikke av AI.</li>
        <li>Vi gir ikke juridisk rådgivning. Vi samler, forklarer og foreslår.</li>
      </ul></section></div>`;
}

/* ---------- Åpne sak ---------- */
async function openCase(token, page = 'oversikt') {
  st = { token, page, c: null, docs: [], analysis: null, aState: 'none', checks: {}, pending: [], open: new Set(), ev: new Set(), answer: null, draft: null, busy: '', err: '' };
  renderCase();
  try {
    const v = await api('GET', `/api/cases/${token}`);
    if (st?.token !== token) return;
    remember(token, v.case.name);
    applyView(v);
    focusMain();
  } catch (e) {
    if (st?.token !== token) return;
    $('#app').innerHTML = `<div class="stack"><h1>Vi fant ikke saken</h1><div class="notice bad" role="alert">${icon('alert')}<div>${esc(e.message)}</div></div><p><a class="btn" href="#/">Tilbake til sakene dine</a></p></div>`;
  }
}

function applyView(v) {
  st.c = v.case; st.docs = v.documents; st.analysis = v.analysis; st.aState = v.analysisState; st.checks = v.checks || {};
  document.title = `${v.case.name} · Saksmappen`;
  renderCase();
}
const reloadCase = async () => applyView(await caseApi('GET'));

function renderCase() { document.body.classList.toggle('simple', simple); renderChrome(); renderPage(); }

function staleBanner() {
  if (!(st.aState === 'stale' && st.docs.length && !st.pending.length && st.analysis)) return '';
  return `<div class="notice noprint" style="margin-bottom:24px">${icon('info')}<div>Du har lagt inn noe nytt, og oversikten er ikke oppdatert ennå. <button class="btn-link" data-act="analyze" style="min-height:0">Oppdater oversikten</button></div></div>`;
}

function renderPage() {
  if (!st) return;
  const el = $('#app');
  if (!st.c && !st.docs.length && st.page !== 'del') { el.innerHTML = '<p class="skeleton">Åpner saken…</p>'; return; }
  const errHtml = st.err ? `<div class="notice bad" role="alert" style="margin-bottom:24px">${icon('alert')}<div>${esc(st.err)}</div></div>` : '';
  let html;
  if (st.page === 'del') html = pageDel();
  else if (st.page === 'overlevering') html = pageOverlevering();
  else if (simple) html = pageEnkel();
  else html = { oversikt: pageOversikt, tidslinje: pageTidslinje, dokumenter: pageDokumenter, frister: pageFrister, mangler: pageMangler, skriv: pageSkriv }[st.page]();
  el.innerHTML = errHtml + (['del', 'overlevering'].includes(st.page) ? '' : staleBanner()) + html;
}

/* ---------- Skjermer ---------- */
function pageOversikt() {
  const a = A();
  if (!st.docs.length) return `<div class="stack"><div class="stack-s"><h1>Velkommen til saken</h1><p class="lead">Begynn med det første brevet. Vi leser det, og du får se hva vi fant.</p></div>${dropzone()}</div>`;
  if (!st.analysis) return `<div class="stack"><div class="stack-s"><h1>Klar til å lese gjennom saken</h1><p class="lead">Du har lagt inn ${st.docs.length} ${plural(st.docs.length, 'dokument', 'dokumenter')}. Vi leser dem og finner frister og det som mangler.</p></div>
    <p><button class="btn primary" data-act="analyze">Les gjennom saken</button></p></div>`;

  const deadlineCard = () => {
    if (wait('b')) return `<p class="skeleton">Vi leter etter frister…</p>`;
    const f = nextDeadline();
    if (f) return `<p class="bigdate">${esc(fmtShort(f.dato))}</p><p>${dueBadge(f.dato)}</p><p class="grow"><strong>${capEsc(f.hva)}</strong></p>
      <a class="btn" href="/api/cases/${esc(st.token)}/calendar.ics?i=${icsIndex(f)}" download>${icon('calendar-plus', 18)} Legg i kalender</a>
      <a class="btn-link" href="#/s/${esc(st.token)}/frister">Se hvordan fristen er regnet ut</a>`;
    const n = needInfo()[0];
    if (n) return `<p class="bigdate" style="font-size:1.5rem">Vi trenger en dato</p><p class="grow">${capEsc(n.hva)}. ${esc(n.regel || '')}</p><a class="btn primary" href="#/s/${esc(st.token)}/frister">Legg inn datoen</a>`;
    return `<p class="grow">Ingen frister ennå. De vises her når du laster opp et vedtak.</p><a class="btn" href="#/s/${esc(st.token)}/dokumenter">Legg inn et brev</a>`;
  };
  const missingCard = () => {
    if (wait('c')) return `<p class="skeleton">Vi ser etter det som mangler…</p>`;
    const m = a.mangler || [], done = m.filter((x) => st.checks[ck(x.hva)]).length, rest = m.filter((x) => !st.checks[ck(x.hva)]);
    if (!m.length) return `<p class="grow">Vi fant ikke noe som mangler i dokumentene du har lagt inn.</p>`;
    return `<p><span class="bignum">${done} av ${m.length}</span></p>
      <div class="progress" role="progressbar" aria-label="Skaffet" aria-valuemin="0" aria-valuemax="${m.length}" aria-valuenow="${done}"><span style="width:${(100 * done) / m.length}%"></span></div>
      <p class="meta" style="margin-top:-4px">${plural(done, 'ting er skaffet', 'ting er skaffet')}</p>
      <ul class="plain-list grow">${rest.slice(0, 2).map((x) => `<li>${capEsc(x.hva)}</li>`).join('') || '<li>Alt er skaffet.</li>'}</ul>
      <a class="btn" href="#/s/${esc(st.token)}/mangler">Se hele listen</a>`;
  };
  const latestCard = () => {
    if (wait('a')) return `<p class="skeleton">Vi bygger tidslinjen…</p>`;
    const ev = (a.tidslinje || []).filter((e) => e.dato).sort((x, y) => x.dato.localeCompare(y.dato)), past = ev.filter((e) => daysUntil(e.dato) <= 0), e = past.length ? past[past.length - 1] : ev[ev.length - 1];
    if (!e) return `<p class="grow">Ingen hendelser ennå.</p>`;
    return `<p class="bigdate" style="font-size:1.5rem">${esc(fmtShort(e.dato))}</p><p class="grow"><strong>${esc(e.tittel)}</strong><br>${esc(e.beskrivelse || '')}</p><a class="btn" href="#/s/${esc(st.token)}/tidslinje">Se tidslinjen</a>`;
  };
  const card = (title, body) => `<section class="card att" aria-label="${title}"><h2 class="eyebrow">${title}</h2>${body}</section>`;

  const claims = flatClaims(), bad = claims.filter((c) => !c.verified), ok = claims.length - bad.length;
  const trust = wait('a') || wait('b') || wait('c') ? '' : `<section class="card" aria-labelledby="h-trust"><div class="trust ${bad.length ? 'some-bad' : ''}">${icon(bad.length ? 'alert' : 'shield', 28)}<div class="stack-s">
      <h2 id="h-trust">Er alt kontrollert?</h2>
      <p>${claims.length ? `Vi fant ${claims.length} ting i dokumentene dine. <strong>${ok} er kontrollert mot dokumentet</strong>${bad.length ? `, og <strong>${bad.length} må du sjekke selv</strong>` : ''}.` : 'Det er ingenting å kontrollere ennå.'}</p>
      ${bad.length ? '<p class="meta">Vi viser dem under, så du kan lese selv i brevet.</p>' : '<p class="meta">Det betyr at sitatet vi viser, står ordrett i dokumentet.</p>'}</div></div></section>
    ${bad.map((c) => claimCard(c)).join('<div style="height:16px"></div>')}`;

  return `<div class="stack">
    <div class="stack-s"><h1>Dette trenger oppmerksomhet nå</h1>${wait('a') ? '' : `<p class="lead">${esc(a.status || '')}</p>`}</div>
    <div class="att-grid">${card('Neste frist', deadlineCard())}${card('Dette mangler', missingCard())}${card('Siste hendelse', latestCard())}</div>
    ${trust}</div>`;
}

function pageTidslinje() {
  const ev = (A().tidslinje || []).map((x, i) => ({ x, i })).sort((p, q) => (p.x.dato || '').localeCompare(q.x.dato || ''));
  const head = `<div class="stack-s"><h1>Tidslinje</h1><p class="lead">Hva som har skjedd, i rekkefølge. Trykk på en hendelse for å se sitatet fra brevet.</p></div>`;
  if (wait('a')) return `<div class="stack">${head}<p class="skeleton">Vi bygger tidslinjen…</p></div>`;
  if (!ev.length) return `<div class="stack">${head}<div class="card">${st.docs.length ? '<p>Tidslinjen er tom ennå. Trykk «Les gjennom saken» på oversikten.</p>' : '<p>Ingen hendelser ennå. Tidslinjen bygges når du har lagt inn et dokument.</p>'}</div></div>`;
  return `<div class="stack">${head}<ol class="timeline">${ev.map(({ x, i }) => `<li>${claimCard({ id: `t${i}`, claim: x.tittel, detail: x.beskrivelse, date: x.dato, quote: x.sitat, dok: x.dok, verified: !!x.verifisert, collapsed: true })}</li>`).join('')}</ol></div>`;
}

function docRow(d) {
  const needs = d.text.includes('[uleselig]') || !d.date;
  const thumb = d.files?.length ? `<img loading="lazy" alt="" src="/api/cases/${esc(st.token)}/files/${esc(d.files[0])}">` : icon('file', 28);
  const when = d.received ? `Mottatt ${fmtShort(d.received)}` : d.date ? `Datert ${fmtShort(d.date)}` : 'Uten dato';
  return `<button class="docrow" data-act="open-doc" data-id="${esc(d.id)}"><span class="thumb">${thumb}</span>
    <span class="grow"><strong>${esc(d.title)}</strong><span class="meta">${esc(d.type)} · ${esc(when)}</span><span style="display:block;margin-top:6px">${needs ? badge('warn', 'alert', 'Trenger gjennomgang') : badge('ok', 'check', 'Lest')}</span></span>${icon('arrow', 20)}</button>`;
}

function pageDokumenter() {
  return `<div class="stack"><div class="stack-s"><h1>Dokumenter</h1><p class="lead">Alt du har lagt inn i saken. Trykk på et dokument for å lese det, se originalen eller rette teksten.</p></div>
    ${dropzone()}<p><button class="btn-link" data-act="paste-text">Lim inn tekst i stedet</button></p>
    ${st.docs.length ? `<ul style="list-style:none;margin:0;padding:0" class="stack-s">${st.docs.map((d) => `<li>${docRow(d)}</li>`).join('')}</ul>` : '<div class="card"><p>Ingen dokumenter ennå. Ta bilde av det første brevet, så begynner vi.</p></div>'}</div>`;
}

function fristCard(f, i) {
  return claimCard({ id: `f${i}`, claim: f.hva, quote: f.sitat, dok: f.dok, verified: !!f.verifisert,
    top: `<div style="margin-top:8px">${f.dato ? dueBadge(f.dato) : badge('warn', 'info', 'Venter på en dato fra deg')}</div>${calcHtml(f)}${f.dato ? '' : receivedForm(f)}`,
    after: f.dato ? `<p style="margin-top:12px"><a class="btn" href="/api/cases/${esc(st.token)}/calendar.ics?i=${icsIndex(f)}" download>${icon('calendar-plus', 18)} Legg i kalender</a></p>` : '' });
}

function pageFrister() {
  const all = (A().frister || []).map((f, i) => ({ f, i }));
  const rank = ({ f }) => (!f.dato ? 0 : daysUntil(f.dato) >= 0 ? 1 : 2);
  all.sort((p, q) => rank(p) - rank(q) || (p.f.dato || '').localeCompare(q.f.dato || ''));

async function guarded(label, fn) {
  st.busy = label; st.err = ''; renderPage();
  try { await fn(); } catch (e) { st.err = e.message; }
  st.busy = ''; renderPage();
}

async function analyze() {
  if (!st.docs.length || st.pending.length) return;
  const token = st.token;
  st.err = ''; st.analysis = {}; st.pending = ['a', 'b', 'c']; renderPage();
  let ok = false;
  try {
    const r = await fetch(`/api/cases/${token}/analyze`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    if (!r.ok || !r.body) throw new Error((await r.json().catch(() => ({}))).error || 'Noe gikk galt.');
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      for (let i; (i = buf.indexOf('\n')) >= 0;) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        const m = JSON.parse(line);
        if (m.error) throw new Error(m.error);
        if (st?.token !== token) return;
        Object.assign(st.analysis, m.data);
        st.pending = st.pending.filter((p) => p !== m.part);
        renderPage();
      }
    }
    ok = true;
  } catch (e) {
    if (st?.token !== token) return;
    st.err = e.message;
    if (!Object.keys(st.analysis).length) st.analysis = null;
  }
  if (st?.token !== token) return;
  st.pending = []; st.aState = ok ? 'fresh' : 'stale'; renderPage();
}

/* ---------- Dokumentinntak: bilde og PDF ---------- */
function toJpeg(file, maxDim = 1800, q = 0.85) {
  return createImageBitmap(file).then((bmp) => {
    const s = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  }).catch(() => { throw new Error(`Vi kunne ikke åpne bildet «${file.name}». Bruk JPEG eller PNG.`); });
}

function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = base + 'pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; res(pdfjsLib); };
    s.onerror = () => rej(new Error('Vi kunne ikke laste PDF-leseren. Sjekk nettforbindelsen, eller ta bilde av brevet i stedet.'));
    document.head.appendChild(s);
  });
}

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('Vi klarte ikke å lese PDF-en. Prøv å ta bilde av brevet i stedet.')), ms))]);

async function pdfToPages(file) {
  const lib = await loadPdfJs();
  // Den innebygde bildedekoderen kan henge i enkelte nettlesere. pdf.js sin egen dekoder er tryggere.
  const pdf = await withTimeout(lib.getDocument({ data: await file.arrayBuffer(), isImageDecoderSupported: false }).promise, 20000);
  const n = Math.min(pdf.numPages, MAX_PAGES), images = [], texts = [];
  for (let p = 1; p <= n; p++) {
    const page = await withTimeout(pdf.getPage(p), 20000);
    const vp = page.getViewport({ scale: 1 }), view = page.getViewport({ scale: Math.min(2, 1500 / vp.width) });
    const c = document.createElement('canvas'); c.width = Math.round(view.width); c.height = Math.round(view.height);
    await withTimeout(page.render({ canvasContext: c.getContext('2d'), viewport: view }).promise, 20000);
    images.push(c.toDataURL('image/jpeg', 0.82));
    const tc = await withTimeout(page.getTextContent(), 20000);
    texts.push(tc.items.map((it) => it.str + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g, ' ').trim());
  }
  let text = texts.join('\n\f\n');
  // Skannet PDF uten tekstlag: la serveren lese bildene i stedet.
  if (text.replace(/\s/g, '').length < 80 * n) text = '';
  return { images, text, cut: pdf.numPages > MAX_PAGES };
}

async function startIntake(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  const pdfs = files.filter((f) => f.type === 'application/pdf'), imgs = files.filter((f) => f.type.startsWith('image/'));
  if (pdfs.length + imgs.length !== files.length) return toast('Bare bilder og PDF støttes.');
  if (pdfs.length > 1 || (pdfs.length && imgs.length)) return toast('Legg inn ett brev om gangen: ett PDF, eller flere bilder av samme brev.');
  intake = { phase: 'reading', source: pdfs.length ? 'pdf' : 'bilde', files, pages: [], fileIds: [], form: null, error: '', cut: false };
  renderIntake(); $('#intake').showModal();
  await runRead();
}

async function runRead() {
  const it = intake, token = st.token;
  it.phase = 'reading'; it.error = ''; renderIntake();
  try {
    let images, text = '';
    if (it.source === 'pdf') { const r = await pdfToPages(it.files[0]); images = r.images; text = r.text; it.cut = r.cut; }
    else { if (it.files.length > MAX_PAGES) it.cut = true; images = await Promise.all(it.files.slice(0, MAX_PAGES).map((f) => toJpeg(f))); }
    it.pages = images; renderIntake();
    const out = await api('POST', `/api/cases/${token}/read`, { images, text });
    if (intake !== it) return;
    it.fileIds = out.files;
    it.form = { title: out.forslag.tittel, type: out.forslag.type, date: out.forslag.dato, received: '', text: out.text };
    it.phase = 'ready';
  } catch (e) {
    if (intake !== it) return;
    it.phase = 'error'; it.error = e.message;
  }
  renderIntake();
}

      <label for="i-title" style="margin-top:0">Tittel</label><input id="i-title" value="${esc(f.title)}">
      <label for="i-type">Type</label><select id="i-type">${TYPES.map((t) => `<option ${t === f.type ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <label for="i-date">Dato på brevet</label><input id="i-date" type="date" value="${esc(f.date)}">
      <label for="i-received">Dato du mottok det</label><input id="i-received" type="date" value="${esc(f.received)}">
      <p class="meta" style="margin-top:6px">Mottaksdato trengs når fristen løper fra du mottok brevet.</p>
      <label for="i-text">Teksten vi leste</label><textarea id="i-text" class="big">${esc(f.text.replace(/\f/g, '\n\f'))}</textarea>
      <p style="margin-top:12px"><strong>Sjekk disse mot bildet.</strong> En feil dato eller et feil beløp gir en feil frist. Trykk for å finne dem i teksten.</p>
      <div class="chips" id="chips"></div>
      <div class="row" style="margin-top:24px"><button class="btn primary" data-act="i-save">Lagre i saken</button><button class="btn" data-act="i-cancel">Avbryt</button></div>`;
  }
  d.innerHTML = `<div class="row between"><h2>Sjekk at vi har lest brevet riktig</h2><button class="btn" data-act="i-cancel" aria-label="Lukk">${icon('x', 18)}</button></div>
    <div class="intake"><div>${pages}</div><div>${right}</div></div>`;
  renderChips();
}

async function saveIntake() {
  const it = intake, text = $('#i-text').value.replace(/\n\f/g, '\f').trim();
  if (!text) return toast('Dokumentet har ingen tekst.');
  try {
    await caseApi('POST', '/documents', { title: $('#i-title').value, type: $('#i-type').value, date: $('#i-date').value, received: $('#i-received').value, text, source: it.source, fileIds: it.fileIds });
  } catch (e) { return toast(e.message); }
  $('#intake').close(); intake = null;
  toast('Dokumentet er lagt til. Vi leser gjennom saken på nytt.');
  await reloadCase();
  analyze();
}

/* ---------- Hendelser ---------- */
const acts = {
  forget: (id) => { saker = saker.filter((s) => s.token !== id); saveSaker(); renderHome(); },
  'try-sample': async () => { const { token } = await api('POST', '/api/cases/sample'); remember(token, 'Eksempelsak: Kari'); location.hash = `#/s/${token}`; },
  'toggle-simple': () => {
    simple = !simple; try { localStorage.setItem(SIMPLE_KEY, simple ? '1' : '0'); } catch {}
    if (st && ['del', 'overlevering'].includes(st.page) === false) st.page = 'oversikt';
    renderCase(); focusMain();
  },
  'toggle-claim': (id) => { st.open.has(id) ? st.open.delete(id) : st.open.add(id); renderPage(); document.querySelector(`[data-act="toggle-claim"][data-id="${CSS.escape(id)}"]`)?.focus(); },
  evidence: (id) => { st.ev.has(id) ? st.ev.delete(id) : st.ev.add(id); renderPage(); document.querySelector(`[data-act="evidence"][data-id="${CSS.escape(id)}"]`)?.focus(); },
  upload: () => $('#f-upload').click(),
  'paste-text': () => {
    $('#viewer').innerHTML = `<div class="row between"><h2>Lim inn tekst</h2><button class="btn" data-act="close" data-id="viewer">${icon('x', 18)} Lukk</button></div>
      <form data-form="paste"><label for="p-title">Tittel</label><input id="p-title" placeholder="For eksempel: Vedtak fra NAV">
      <label for="p-type">Type</label><select id="p-type">${TYPES.map((t) => `<option>${t}</option>`).join('')}</select>
      <label for="p-date">Dato på brevet</label><input id="p-date" type="date">
      <label for="p-received">Dato du mottok det</label><input id="p-received" type="date">
      <label for="p-text">Tekst</label><textarea id="p-text" class="big" required></textarea>
      <div class="row" style="margin-top:24px"><button class="btn primary" type="submit">Legg til i saken</button></div></form>`;
    $('#viewer').showModal(); $('#p-title').focus();
  },
  analyze: () => analyze(),
  'open-doc': (id, el) => openDoc(id, el?.dataset.quote || ''),
  'edit-doc': (id) => openDoc(id, '', true),
  'save-edit': async (id) => {
    const d = docById(id), text = $('#v-edit').value.trim(); if (!text) return toast('Teksten kan ikke være tom.');
    await caseApi('PUT', `/documents/${id}`, { title: d.title, type: d.type, date: d.date, received: d.received, text, source: d.source });
    await reloadCase(); openDoc(id, ''); toast('Teksten er lagret. Oppdater oversikten for å ta den med.');
  },
  'del-doc': async (id) => {
    if (!confirm('Slette dokumentet og bildene fra saken?')) return;
    await caseApi('DELETE', `/documents/${id}`); $('#viewer').close(); await reloadCase();
  },
  'd-klage': () => guarded('Vi skriver et utkast…', async () => { st.draft = (await caseApi('POST', '/draft', { kind: 'klage', docId: $('#d-doc').value })).tekst; }),
  'd-over': () => guarded('Vi lager oppsummeringen…', async () => { st.draft = (await caseApi('POST', '/draft', { kind: 'overlevering' })).tekst; }),
  copy: (id, el) => navigator.clipboard?.writeText(st.draft).then(() => { el.textContent = 'Kopiert'; }),
  share: async () => {
    const url = `${location.origin}/#/s/${st.token}`;
    try { await navigator.clipboard.writeText(url); toast('Lenken er kopiert. Alle som har den kan se og endre saken.'); }
    catch { $('#sharelink')?.select(); toast('Marker lenken og kopier den selv.'); }
  },
  rename: async () => {
    const name = prompt('Nytt navn på saken', st.c.name); if (!name?.trim()) return;
    await caseApi('PUT', '', { name: name.trim(), person: st.c.person }); remember(st.token, name.trim()); await reloadCase();
  },
  'delete-case': async () => {
    if (!confirm('Slette saken, alle dokumenter og alle bilder for godt? Dette kan ikke angres.')) return;
    await caseApi('DELETE'); saker = saker.filter((s) => s.token !== st.token); saveSaker(); location.hash = '#/';
  },
  print: () => window.print(),
  close: (id) => $('#' + id).close(),
  chip: (id) => {
    const ta = $('#i-text'), i = ta.value.indexOf(id); if (i < 0) return;
    ta.focus(); ta.setSelectionRange(i, i + id.length);
    ta.scrollTop = Math.max(0, (ta.value.slice(0, i).split('\n').length - 3) * 26);
  },
  'i-save': () => saveIntake(),
  'i-retry': () => runRead(),
  'i-cancel': () => { $('#intake').close(); intake = null; },
};

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = acts[el.dataset.act]; if (!fn) return;
  try { await fn(el.dataset.id, el); } catch (err) { toast(err.message); }
});

document.addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  try {
    if (f.dataset.form === 'new-case') {
      const name = $('#newname').value.trim() || 'Ny sak';
      const { token } = await api('POST', '/api/cases', { name }); remember(token, name); location.hash = `#/s/${token}`;
    } else if (f.dataset.form === 'received') {
      await setReceived(f.dataset.id, f.querySelector('input').value);
    } else if (f.dataset.form === 'ask') {
      const q = $('#q').value.trim(); if (q) await guarded('Vi leter i saken…', async () => { st.answer = await caseApi('POST', '/ask', { question: q }); });
    } else if (f.dataset.form === 'paste') {
      const text = $('#p-text').value.trim(); if (!text) return;
      await caseApi('POST', '/documents', { title: $('#p-title').value, type: $('#p-type').value, date: $('#p-date').value, received: $('#p-received').value, text, source: 'tekst' });
      $('#viewer').close(); await reloadCase(); analyze();
    }
  } catch (err) { toast(err.message); }
});

document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'f-upload') { const files = t.files; await startIntake(files); t.value = ''; }
  else if (t.dataset?.check !== undefined) await setCheck(t.dataset.check, t.checked, t.id);
});
document.addEventListener('input', (e) => { if (e.target.id === 'i-text') renderChips(); });

document.addEventListener('dragover', (e) => { const z = e.target.closest('#dropzone'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { e.target.closest?.('#dropzone')?.classList.remove('over'); });
document.addEventListener('drop', async (e) => {
  const z = e.target.closest('#dropzone'); if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  await startIntake(e.dataTransfer.files);
});

$('#intake').addEventListener('cancel', (e) => { if (intake?.phase === 'ready' && !confirm('Forkaste dokumentet?')) e.preventDefault(); });

route();
</script>
</body>
</html>
