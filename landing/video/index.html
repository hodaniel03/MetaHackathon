<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* A calm, warm table seen from above. Papers become a timeline. No readable text anywhere. */
      :root {
        --ink: #162232;
        --paper: #fffdf8;
        --ok: #14714a;
        --amber: #c98a00;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #d9c19c; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #scene { position: absolute; inset: 0; }
      .abs { position: absolute; left: 0; top: 0; }

      #bg {
        position: absolute; inset: -80px;
        background:
          repeating-linear-gradient(92deg, rgba(120, 84, 48, 0.06) 0 2px, rgba(255, 255, 255, 0.025) 2px 8px, rgba(90, 60, 30, 0.05) 8px 13px),
          radial-gradient(ellipse at 32% 28%, #efe1c9 0%, #dcc4a0 52%, #bd9d74 100%);
      }
      #shaft {
        position: absolute; left: 0; top: -300px; width: 560px; height: 1900px;
        background: linear-gradient(90deg, rgba(255, 246, 220, 0) 0%, rgba(255, 246, 220, 0.62) 50%, rgba(255, 246, 220, 0) 100%);
        filter: blur(26px); mix-blend-mode: soft-light;
      }
      #world { position: absolute; inset: 0; transform-origin: 960px 540px; }

      .paper {
        position: absolute; left: 0; top: 0; width: 440px; height: 300px; border-radius: 8px;
        background: linear-gradient(160deg, #fffefb 0%, var(--paper) 60%, #f6f1e6 100%);
        box-shadow: 0 1px 1px rgba(70, 48, 24, 0.2), 0 6px 10px rgba(70, 48, 24, 0.14), 0 26px 38px rgba(70, 48, 24, 0.2);
        transform-origin: 50% 50%;
      }
      .paper::after { /* folded corner */
        content: ""; position: absolute; right: 0; top: 0; width: 46px; height: 46px; border-radius: 0 8px 0 0;
        background: linear-gradient(225deg, #e9dfc9 0 48%, rgba(0, 0, 0, 0) 50%);
      }
      .bar { position: absolute; left: 36px; height: 11px; border-radius: 6px; background: rgba(22, 34, 50, 0.15); }
      .bar.h { top: 40px; width: 190px; height: 18px; background: rgba(30, 58, 95, 0.55); }
      .stamp { position: absolute; right: 40px; bottom: 34px; width: 74px; height: 74px; border-radius: 50%; border: 5px solid rgba(30, 58, 95, 0.28); }
      .stamp::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 3px solid rgba(30, 58, 95, 0.2); }

      #tl-line { position: absolute; left: 1338px; top: 150px; width: 5px; height: 730px; border-radius: 3px; background: var(--ink); opacity: 0; transform-origin: 50% 0; }
      .dot { position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: #faf9f6; border: 6px solid var(--ink); }
      .chip { position: absolute; left: 0; top: 0; width: 58px; height: 58px; border-radius: 50%; background: var(--ok); box-shadow: 0 6px 14px rgba(20, 113, 74, 0.35); display: flex; align-items: center; justify-content: center; }
      .chip.warn { background: #fff4d6; border: 5px solid var(--amber); box-shadow: 0 6px 14px rgba(154, 107, 0, 0.3); }
      .chip svg { width: 30px; height: 30px; }

      #cup { position: absolute; left: 0; top: 0; width: 230px; height: 230px; filter: blur(2.5px); }
      #saucer { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fbf7ef, #e6dccb); box-shadow: 0 20px 34px rgba(70, 48, 24, 0.25); }
      #mug { position: absolute; left: 36px; top: 36px; width: 158px; height: 158px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #ffffff, #efe7d8 70%); box-shadow: 0 8px 16px rgba(70, 48, 24, 0.22); }
      #coffee { position: absolute; left: 22px; top: 22px; width: 114px; height: 114px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #7a4f33, #3d2416 78%); }
      #handle { position: absolute; left: 176px; top: 78px; width: 56px; height: 66px; border: 16px solid #efe7d8; border-left: 0; border-radius: 0 40px 40px 0; }
      .steam { position: absolute; width: 14px; height: 120px; border-radius: 8px; background: linear-gradient(0deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0)); filter: blur(7px); }

      #phone { position: absolute; left: 0; top: 0; width: 290px; height: 590px; border-radius: 52px; background: linear-gradient(150deg, #22334b, #0f1826); box-shadow: 0 2px 3px rgba(0, 0, 0, 0.4), 0 40px 70px rgba(30, 18, 6, 0.45); }
      #screen { position: absolute; left: 13px; top: 13px; right: 13px; bottom: 13px; border-radius: 40px; overflow: hidden; background: linear-gradient(170deg, #35506f, #1b2b40); }
      #lens { position: absolute; left: 50%; top: 22px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #0a0f18; box-shadow: inset 0 0 0 3px #26364d; }
      #view { position: absolute; left: 34px; right: 34px; top: 120px; height: 250px; border-radius: 6px; background: var(--paper); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3); }
      #view .bar { left: 20px; height: 8px; }
      #view .bar.h { top: 24px; height: 12px; width: 100px; }
      .vfc { position: absolute; width: 38px; height: 38px; border: 0 solid #7fe0b2; }
      #vf1 { left: 18px; top: 104px; border-top-width: 6px; border-left-width: 6px; border-top-left-radius: 10px; }
      #vf2 { right: 18px; top: 104px; border-top-width: 6px; border-right-width: 6px; border-top-right-radius: 10px; }
      #vf3 { left: 18px; top: 354px; border-bottom-width: 6px; border-left-width: 6px; border-bottom-left-radius: 10px; }
      #vf4 { right: 18px; top: 354px; border-bottom-width: 6px; border-right-width: 6px; border-bottom-right-radius: 10px; }
      #shutter { position: absolute; left: 50%; bottom: 40px; width: 74px; height: 74px; margin-left: -37px; border-radius: 50%; border: 6px solid #fff; }
      #shutter::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #fff; }
      #phone-ok { position: absolute; left: 50%; top: 190px; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: var(--ok); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3); }
      #phone-ok svg { width: 64px; height: 64px; }

      .mote { position: absolute; left: 0; top: 0; border-radius: 50%; background: rgba(255, 248, 230, 0.9); filter: blur(1.5px); }
      #flash { position: absolute; inset: 0; background: #fffaf0; opacity: 0; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, rgba(22, 34, 50, 0) 48%, rgba(22, 34, 50, 0.42) 100%); }
      #grain { position: absolute; left: -120px; top: -120px; width: 2160px; height: 1320px; opacity: 0.2; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div id="bg"></div>
        <div id="shaft"></div>

        <div id="world">
          <div id="tl-line"></div>
          <div class="dot" id="dot1"></div><div class="dot" id="dot2"></div><div class="dot" id="dot3"></div><div class="dot" id="dot4"></div>

          <div id="cup">
            <div id="saucer"></div><div id="handle"></div><div id="mug"></div><div id="coffee"></div>
            <div class="steam" id="steam1"></div><div class="steam" id="steam2"></div><div class="steam" id="steam3"></div>
          </div>

          <div class="paper" id="p1"><div class="bar h"></div><div class="bar" style="top:96px;width:340px"></div><div class="bar" style="top:124px;width:310px"></div><div class="bar" style="top:152px;width:330px"></div><div class="bar" style="top:180px;width:240px"></div><div class="stamp"></div></div>
          <div class="paper" id="p2"><div class="bar h"></div><div class="bar" style="top:96px;width:320px"></div><div class="bar" style="top:124px;width:340px"></div><div class="bar" style="top:152px;width:290px"></div><div class="bar" style="top:180px;width:330px"></div><div class="bar" style="top:208px;width:200px"></div></div>
          <div class="paper" id="p3"><div class="bar h" style="width:150px"></div><div class="bar" style="top:96px;width:350px"></div><div class="bar" style="top:124px;width:300px"></div><div class="bar" style="top:152px;width:340px"></div><div class="stamp"></div></div>
          <div class="paper" id="p4"><div class="bar h" style="width:210px"></div><div class="bar" style="top:96px;width:330px"></div><div class="bar" style="top:124px;width:350px"></div><div class="bar" style="top:152px;width:280px"></div><div class="bar" style="top:180px;width:320px"></div></div>

          <div class="chip" id="c1"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div class="chip" id="c2"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div class="chip warn" id="c3"><svg viewBox="0 0 24 24" fill="none" stroke="#9a6b00" stroke-width="3.4" stroke-linecap="round"><path d="M12 6v8"/><path d="M12 18.5h.01"/></svg></div>
          <div class="chip" id="c4"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>

          <div id="phone">
            <div id="screen">
              <div id="lens"></div>
              <div id="view"><div class="bar h"></div><div class="bar" style="top:56px;width:190px"></div><div class="bar" style="top:78px;width:170px"></div><div class="bar" style="top:100px;width:180px"></div><div class="bar" style="top:122px;width:120px"></div></div>
              <div class="vfc" id="vf1"></div><div class="vfc" id="vf2"></div><div class="vfc" id="vf3"></div><div class="vfc" id="vf4"></div>
              <div id="shutter"></div>
              <div id="phone-ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
            </div>
          </div>
        </div>

        <div id="motes"></div>
        <div id="flash"></div>
        <div id="vignette"></div>
        <div id="grain"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const D = 12;

      // Deterministic pseudo-random numbers (no Math.random: every render must be identical).
      let seed = 20260111;
      const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);

      // Resting positions (centres) and the timeline slots. Everything returns here at the end, so the loop is seamless.
      const rest = {
        p1: { x: 430, y: 300, r: -9 },
        p2: { x: 860, y: 560, r: 4 },
        p3: { x: 520, y: 800, r: -5 },
        p4: { x: 1030, y: 250, r: 12 },
      };
      const slots = { p4: 250, p1: 440, p2: 630, p3: 820 };
      const SLOT_X = 1520, SMALL = 0.52;

      Object.entries(rest).forEach(([id, p]) => gsap.set('#' + id, { x: p.x, y: p.y, xPercent: -50, yPercent: -50, rotation: p.r, scale: 1 }));
      gsap.set('#cup', { x: 230, y: 905, xPercent: -50, yPercent: -50 });
      gsap.set('#phone', { x: 2350, y: 1500, xPercent: -50, yPercent: -50, rotation: 28, scale: 1.1, filter: 'blur(8px)' });
      gsap.set('#vf1,#vf2,#vf3,#vf4', { opacity: 0, scale: 1.5 });
      gsap.set('#phone-ok', { scale: 0 });
      gsap.set('#tl-line', { scaleY: 0 });
      Object.values({ d1: 'p4', d2: 'p1', d3: 'p2', d4: 'p3' }).forEach((pid, i) => gsap.set('#dot' + (i + 1), { x: 1340, y: slots[pid], xPercent: -50, yPercent: -50, scale: 0 }));
      Object.values({ c1: 'p4', c2: 'p1', c3: 'p3', c4: 'p2' }).forEach((pid, i) => gsap.set('#c' + (i + 1), { x: SLOT_X + 138, y: slots[pid], xPercent: -50, yPercent: -50, scale: 0 }));
      gsap.set('#steam1', { x: 205, y: 818, opacity: 0 }); gsap.set('#steam2', { x: 232, y: 810, opacity: 0 }); gsap.set('#steam3', { x: 258, y: 820, opacity: 0 });

      // Camera: a slow push in and back out, with the background and light moving at other speeds for depth.
      tl.to('#world', { scale: 1.05, x: -26, duration: 6, ease: 'sine.inOut' }, 0);
      tl.to('#world', { scale: 1, x: 0, duration: 6, ease: 'sine.inOut' }, 6);
      tl.to('#bg', { scale: 1.03, x: 14, duration: 6, ease: 'sine.inOut' }, 0);
      tl.to('#bg', { scale: 1, x: 0, duration: 6, ease: 'sine.inOut' }, 6);
      gsap.set('#shaft', { x: -260, rotation: 16 });
      tl.to('#shaft', { x: 1500, duration: 6, ease: 'sine.inOut' }, 0);
      tl.to('#shaft', { x: -260, duration: 6, ease: 'sine.inOut' }, 6);

      // Steam, dust and grain: all periodic over 12 s.
      [['#steam1', 0], ['#steam2', 1.3], ['#steam3', 2.6]].forEach(([s, o]) => {
        tl.to(s, { opacity: 0.8, y: '-=46', duration: 2.4, ease: 'sine.inOut' }, o);
        tl.to(s, { opacity: 0, duration: 2.4, ease: 'sine.in' }, o + 2.4);
        tl.to(s, { opacity: 0.8, y: '+=46', duration: 0.01 }, o + 4.8);
        tl.to(s, { opacity: 0.5, y: '-=46', duration: 2.4, ease: 'sine.inOut' }, o + 4.81);
        tl.to(s, { opacity: 0, duration: 2.4, ease: 'sine.in' }, o + 7.2);
      });
      const motes = document.getElementById('motes');
      for (let i = 0; i < 22; i++) {
        const m = document.createElement('div'); m.className = 'mote'; m.id = 'm' + i; const s = 3 + rnd() * 5;
        m.style.width = m.style.height = s + 'px'; motes.appendChild(m);
        const x = rnd() * 1920, y = 160 + rnd() * 860, dx = (rnd() - 0.5) * 120, dy = -90 - rnd() * 160, a = 0.25 + rnd() * 0.5;
        gsap.set(m, { x, y, opacity: a });
        tl.to(m, { x: x + dx, y: y + dy, duration: 6, ease: 'sine.inOut' }, 0);
        tl.to(m, { x, y, duration: 6, ease: 'sine.inOut' }, 6);
      }
      for (let i = 0; i < 144; i++) tl.set('#grain', { x: Math.floor(rnd() * 120), y: Math.floor(rnd() * 120) }, i * (D / 144));

      // 0.5 to 2.0: the phone glides in over the second sheet.
      tl.to('#phone', { x: 1090, y: 640, rotation: -7, scale: 1.04, filter: 'blur(0px)', duration: 1.6, ease: 'power3.out' }, 0.5);
      tl.to('#p2', { scale: 1.03, duration: 1.2, ease: 'sine.inOut' }, 1.2);
      // 2.0 to 3.4: brackets lock, shutter, flash, and the phone shows it has read the sheet.
      tl.to('#vf1,#vf2,#vf3,#vf4', { opacity: 1, scale: 1, duration: 0.5, ease: 'power3.out' }, 2.0);
      tl.to('#flash', { opacity: 0.55, duration: 0.09, ease: 'power2.out' }, 2.7);
      tl.to('#flash', { opacity: 0, duration: 0.35, ease: 'power2.in' }, 2.79);
      tl.to('#phone-ok', { scale: 1, duration: 0.45, ease: 'back.out(2.2)' }, 3.0);
      // 3.7 to 4.6: the phone leaves.
      tl.to('#phone', { x: 2350, y: 1500, rotation: 24, filter: 'blur(8px)', duration: 1.0, ease: 'power2.in' }, 3.7);
      tl.to('#phone-ok', { scale: 0, duration: 0.2 }, 3.7);
      tl.to('#p2', { scale: 1, duration: 0.6, ease: 'sine.inOut' }, 3.7);

      // 3.9 to 5.5: the sheets line up as a timeline.
      tl.to('#tl-line', { scaleY: 1, opacity: 0.8, duration: 1.4, ease: 'power2.inOut' }, 4.0);
      Object.entries(slots).forEach(([id, y], i) => {
        tl.to('#' + id, { x: SLOT_X, y, rotation: 0, scale: SMALL, duration: 1.4, ease: 'power3.inOut' }, 3.9 + i * 0.12);
      });
      ['p4', 'p1', 'p2', 'p3'].forEach((id, i) => tl.to('#dot' + (i + 1), { scale: 1, duration: 0.4, ease: 'back.out(2.4)' }, 4.9 + i * 0.16));

      // 5.7 to 8.2: each sheet gets its mark. One stays amber, because it could not be checked.
      [['#c1', 5.7], ['#c2', 6.1], ['#c3', 6.5], ['#c4', 6.9]].forEach(([c, t]) => tl.to(c, { scale: 1, duration: 0.45, ease: 'back.out(2.6)' }, t));
      tl.to('#c3', { scale: 1.14, duration: 0.5, ease: 'sine.inOut' }, 7.5);
      tl.to('#c3', { scale: 1, duration: 0.5, ease: 'sine.inOut' }, 8.0);

      // 8.6 to 11.6: it all settles back, ready to start again.
      [['#c4', 8.6], ['#c3', 8.7], ['#c2', 8.8], ['#c1', 8.9]].forEach(([c, t]) => tl.to(c, { scale: 0, duration: 0.3, ease: 'power2.in' }, t));
      ['dot4', 'dot3', 'dot2', 'dot1'].forEach((d, i) => tl.to('#' + d, { scale: 0, duration: 0.3, ease: 'power2.in' }, 9.0 + i * 0.08));
      tl.to('#tl-line', { scaleY: 0.4, opacity: 0, duration: 0.9, ease: 'power2.inOut' }, 9.2);
      Object.entries(rest).forEach(([id, p], i) => {
        tl.to('#' + id, { x: p.x, y: p.y, rotation: p.r, scale: 1, duration: 1.7, ease: 'power3.inOut' }, 9.3 + i * 0.1);
      });

      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
